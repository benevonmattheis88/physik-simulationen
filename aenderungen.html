<script>
(function () {
  var REPO = 'https://github.com/benevonmattheis88/physik-simulationen';
  var daten = JSON.parse(document.getElementById('aenderungsdaten').textContent);
  var q = new URLSearchParams(location.search);
  var seit = q.get('seit') ? Date.parse(q.get('seit')) : NaN;
  var nurSim = q.get('sim');
  if (nurSim && !daten.simulationen[nurSim]) nurSim = null;

  function datumText(ms) {
    var d = new Date(ms);
    return d.toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric' });
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // Einträge je Simulation sammeln, neueste zuerst
  var jeSim = {};
  daten.eintraege.forEach(function (e) {
    var t = Date.parse(e.zeit);
    e.sims.forEach(function (id) { (jeSim[id] = jeSim[id] || []).push({ t:t, e:e }); });
  });
  Object.keys(jeSim).forEach(function (id) { jeSim[id].sort(function (a, b) { return b.t - a.t; }); });

  var ids = Object.keys(daten.simulationen).filter(function (id) { return jeSim[id]; });
  ids.sort(function (a, b) { return jeSim[b][0].t - jeSim[a][0].t; });
  if (nurSim) ids = [nurSim];

  var filter = document.getElementById('filter');
  if (nurSim) {
    filter.hidden = false;
    filter.innerHTML = '<p>' + (isNaN(seit) ? '' : 'Blau markiert ist, was seit deinem letzten Besuch am <strong>' + datumText(seit) + '</strong> neu ist. ') +
      '<a href="aenderungen.html' + (isNaN(seit) ? '' : '?seit=' + encodeURIComponent(q.get('seit'))) + '">Änderungen aller Simulationen anzeigen</a></p>';
  }

  function eintragHtml(x) {
    var neu = !isNaN(seit) && x.t > seit;
    return '<li' + (neu ? ' class="neu"' : '') + '><span class="datum">' + datumText(x.t) + '</span>' +
      (neu ? '<span class="marke">neu</span>' : '') + '<br>' + esc(x.e.text) + '</li>';
  }

  var html = '';
  ids.forEach(function (id) {
    var s = daten.simulationen[id];
    var liste = jeSim[id];
    var neue = liste.filter(function (x) { return !isNaN(seit) && x.t > seit; });
    var alte = liste.filter(function (x) { return isNaN(seit) || x.t <= seit; });
    html += '<section class="sim" id="' + id + '"><h2>' + esc(s.titel) + '</h2>' +
      '<p class="links"><a href="' + s.pfad + '">▶ Simulation öffnen</a>' +
      '<a href="' + REPO + '/commits/main/' + s.pfad + '" target="_blank" rel="noopener">↗ GitHub-Verlauf</a></p>';
    if (neue.length) html += '<ul class="eintraege">' + neue.map(eintragHtml).join('') + '</ul>';
    if (neue.length && alte.length) html += '<h3 class="frueher">Frühere Änderungen</h3>';
    if (alte.length) html += '<ul class="eintraege">' + alte.map(eintragHtml).join('') + '</ul>';
    html += '</section>';
  });
  document.getElementById('liste').innerHTML = html;
  if (!nurSim && location.hash) { var z = document.getElementById(location.hash.slice(1)); if (z) z.scrollIntoView(); }
})();
</script>
