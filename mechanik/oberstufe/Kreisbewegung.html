<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Simulation Kreisbewegung</title>
<style>
  :root { --bg:#f4f6f9; --panel:#ffffff; --ink:#1d2733; --muted:#5b6675; --line:#d5dbe3;
          --blue:#1F4E79; --red:#C0392B; --green:#2E7D32; --orange:#E67E22; --purple:#7B3FA0; }
  * { box-sizing:border-box; }
  html { font-size:14px; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
               font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow:hidden;
               -webkit-text-size-adjust:100%; }
  #app { display:flex; height:100vh; height:100dvh; width:100vw; }
  #stage { flex:1 1 auto; position:relative; min-width:0; min-height:0; }
  #cv { display:block; width:100%; height:100%; touch-action:none; }
  #panel { flex:0 0 25.7rem; max-width:52vw; background:var(--panel); border-left:1px solid var(--line);
           padding:.6rem .85rem; display:flex; flex-direction:column; gap:.4rem; overflow-y:auto; }
  body.nopanel #panel { display:none; }
  #ctrl, #info { display:flex; flex-direction:column; gap:.35rem; min-width:0; }
  h1 { font-size:1.2rem; margin:0; color:var(--blue); }
  .tabs { display:flex; gap:6px; }
  .tabs button { flex:1; }
  button { font:inherit; font-size:1rem; padding:.5rem .6rem; border-radius:8px; border:1px solid var(--line);
           background:#eef2f7; color:var(--ink); cursor:pointer; touch-action:manipulation; min-height:2.6rem; }
  button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  button.warn { background:#fdecea; border-color:#f3b8b1; }
  .row { display:flex; align-items:center; gap:8px; font-size:1rem; }
  .row label { flex:0 0 6.8rem; }
  .row input[type=range] { flex:1; min-width:0; height:1.9rem; }
  .row output { flex:0 0 5.3rem; text-align:right; font-variant-numeric:tabular-nums; }
  select { font:inherit; font-size:1rem; padding:.3rem; flex:1; min-width:0; }
  .checks { display:flex; flex-wrap:wrap; gap:.3rem .9rem; font-size:1rem; }
  .checks label { display:flex; align-items:center; gap:5px; min-height:1.9rem; }
  .checks input { width:1.3rem; height:1.3rem; }
  table { border-collapse:collapse; width:100%; font-size:.93rem; font-variant-numeric:tabular-nums; }
  td, th { border-bottom:1px solid var(--line); padding:.2rem .3rem; text-align:right; }
  td:first-child, th:first-child { text-align:left; }
  th { color:var(--muted); font-weight:600; }
  .k1 { color:var(--orange); } .k2 { color:var(--purple); }
  .btns { display:flex; gap:6px; }
  .btns button { flex:1; }
  #plotwrap { display:none; flex-direction:column; gap:.3rem; }
  #plot { display:block; width:100%; height:8.4rem; background:#fafbfc; border:1px solid var(--line); border-radius:6px; }
  #mtable { max-height:4.6rem; overflow:auto; font-size:.86rem; }
  #mtable table { font-size:.86rem; }
  .small { font-size:.86rem; color:var(--muted); }
  .hidden { display:none !important; }

  /* Werkzeugleiste auf der Simulation */
  #tools { position:absolute; top:8px; right:8px; display:flex; gap:6px; z-index:5; }
  #tools button { min-width:44px; height:44px; min-height:44px; padding:0 10px; font-size:16px; font-weight:600;
                  background:rgba(255,255,255,.88); border:1px solid #c3ccd8; border-radius:10px;
                  box-shadow:0 2px 6px rgba(0,0,0,.15); display:flex; align-items:center; justify-content:center; }
  #tools button svg { width:22px; height:22px; stroke:var(--ink); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #tools button:active { background:#dde5ef; }

  @media (max-height: 800px) {
    h1 { display:none; }
    button { padding:.35rem .6rem; min-height:2.4rem; }
    td, th { padding:.12rem .3rem; }
    #plot { height:6.2rem; }
    #mtable { max-height:3.6rem; }
    .row input[type=range] { height:1.6rem; }
    .checks label { min-height:1.6rem; }
  }
  @media (max-width: 900px) and (orientation: landscape) { #panel { flex-basis:22.2rem; } .row label { flex-basis:6rem; } }

  /* iPad hochkant: Simulation oben, Bedienfeld zweispaltig darunter */
  @media (min-width: 641px) and (max-width: 900px) and (orientation: portrait) {
    #app { flex-direction:column; }
    #panel { flex:0 0 auto; max-width:none; max-height:50vh; width:100%; border-left:0; border-top:1px solid var(--line);
             display:grid; grid-template-columns:1fr 1fr; gap:.4rem 1.1rem; align-items:start; }
    h1 { display:none; }
  }

  /* Handy hochkant: Simulation oben, Bedienfeld darunter, Seite darf scrollen */
  @media (max-width: 640px) {
    html, body { height:auto; overflow:auto; }
    #app { flex-direction:column; height:auto; min-height:100vh; }
    #stage { flex:none; height:min(100vw, 60vh); }
    body.nopanel #stage { height:100vh; height:100dvh; }
    #panel { flex:none; width:100%; max-width:none; border-left:0; border-top:1px solid var(--line); overflow:visible; }
    h1 { display:block; }
    #tools button { min-width:40px; height:40px; min-height:40px; padding:0 8px; }
  }

  /* Drehhinweis, wenn das Handy quer gehalten wird */
  #rotate { display:none; position:fixed; inset:0; z-index:50; background:rgba(29,39,51,.94); color:#fff;
            align-items:center; justify-content:center; text-align:center; padding:20px; }
  #rotate .box { max-width:420px; display:flex; flex-direction:column; align-items:center; gap:14px; font-size:18px; }
  #rotate svg { width:80px; height:80px; stroke:#fff; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  #rotate button { font-size:17px; background:#fff; color:var(--ink); padding:10px 18px; }
  @media (orientation: landscape) and (max-height: 500px) {
    body:not(.quer) #rotate { display:flex; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="tools">
      <button id="fsMinus" title="Schrift kleiner">A−</button>
      <button id="fsPlus" title="Schrift größer">A+</button>
      <button id="view" title="Darstellung umschalten">Symbol</button>
      <button id="full" title="Vollbild"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button id="panelBtn" title="Bedienfeld aus-/einblenden"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
    </div>
  </div>
  <div id="panel">
    <div id="ctrl">
      <h1>Kreisbewegung</h1>
      <div class="tabs">
        <button id="tabDesc" class="on">Beschreiben</button>
        <button id="tabForce">Kraft</button>
      </div>
      <div class="row"><label>Radius r<sub>1</sub></label><input id="r1" type="range" min="0.10" max="1.00" step="0.05" value="0.40"><output id="r1o"></output></div>
      <div class="row"><label>Radius r<sub>2</sub></label><input id="r2" type="range" min="0.10" max="1.00" step="0.05" value="0.80"><output id="r2o"></output></div>
      <div class="row"><label>ω</label><input id="w" type="range" min="0" max="6" step="0.1" value="1.0"><output id="wo"></output></div>
      <div class="row force"><label>Masse m</label><input id="m" type="range" min="0.05" max="1.00" step="0.05" value="0.25"><output id="mo"></output></div>
      <div class="checks">
        <label><input id="cb2" type="checkbox" checked>Körper 2</label>
        <label><input id="cbArc" type="checkbox" checked>Winkel und Bogen</label>
        <label><input id="cbV" type="checkbox">v-Pfeile</label>
        <label class="force"><input id="cbF" type="checkbox" checked>Kraftpfeile</label>
      </div>
      <div class="btns">
        <button id="play" class="on">Pause</button>
        <button id="reset">Zurück auf φ = 0</button>
      </div>
      <div class="btns force">
        <button id="release" class="warn">Faden von Körper 2 loslassen</button>
      </div>
    </div>
    <div id="info">
      <table id="vals"></table>
      <div id="plotwrap">
        <div class="btns">
          <button id="measure">Messen (Körper 1)</button>
          <button id="clear">Löschen</button>
        </div>
        <div class="row"><label>x-Achse</label>
          <select id="xsel">
            <option value="w">ω in Hz</option><option value="w2" selected>ω² in Hz²</option>
            <option value="r">r in m</option><option value="m">m in kg</option>
            <option value="v">v in m/s</option><option value="v2">v² in m²/s²</option>
          </select></div>
        <canvas id="plot"></canvas>
        <div id="mtable"></div>
      </div>
      <div class="small">Pfeile maßstäblich (Legende unten rechts), Zeit in Echtzeit. Modell: masseloser Faden, reibungsfreie Unterlage.</div>
    </div>
  </div>
</div>
<div id="rotate">
  <div class="box">
    <svg viewBox="0 0 64 64"><rect x="20" y="6" width="24" height="42" rx="4"/><path d="M29 42h6"/><path d="M50 30a20 20 0 0 1-12 22M38 52l1-6M38 52l-6-1"/></svg>
    <div>Bitte das Handy hochkant halten.</div>
    <button id="rotGo">Trotzdem quer weiter</button>
  </div>
</div>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");
  const pc = $("plot"), pctx = pc.getContext("2d");
  const S = { mode: "desc", view: "3d", fs: 1, phi: 0, running: true, released: false, rel: null, data: [] };
  const C = { blue:"#1F4E79", red:"#C0392B", green:"#2E7D32", orange:"#E67E22", purple:"#7B3FA0", grey:"#9aa4b1" };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  const SUB_RE = /(^|[^A-Za-z])([FavhTEr])_(H,max|Seil|res|max|min|oben|Z|G|N|H|1|2)(?![A-Za-z0-9])/g;
  function subParts(t) {           // zerlegt Text in normale und tiefgestellte Teile
    const out = []; let pos = 0, m;
    SUB_RE.lastIndex = 0;
    while ((m = SUB_RE.exec(t))) {
      out.push([t.slice(pos, m.index) + m[1] + m[2], false]); out.push([m[3], true]); pos = m.index + m[0].length;
    }
    out.push([t.slice(pos), false]);
    return out.filter(q => q[0]);
  }
  function drawSub(c, t, x, y, size, font, align, weight) {   // Canvas-Text mit echten Indizes
    const parts = subParts(t), fs = q => (weight ? weight + " " : "") + (q[1] ? Math.round(size * 0.7) : size) + "px " + font;
    let w = 0; for (const q of parts) { c.font = fs(q); w += c.measureText(q[0]).width; }
    let cx = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
    c.textAlign = "left";
    for (const q of parts) { c.font = fs(q); c.fillText(q[0], cx, q[1] ? y + size * 0.25 : y); cx += c.measureText(q[0]).width; }
  }
  const fmt = (x, d) => (isFinite(x) ? x.toFixed(d).replace(".", ",") : "–");

  function P() {
    return { r1:+$("r1").value, r2:+$("r2").value, w:+$("w").value, m:+$("m").value,
             two:$("cb2").checked, arc:$("cbArc").checked, v:$("cbV").checked, f:$("cbF").checked };
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    for (const c of [cv, pc]) {
      const r = c.getBoundingClientRect();
      c.width = Math.max(1, Math.round(r.width * dpr)); c.height = Math.max(1, Math.round(r.height * dpr));
      c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    drawPlot();
  }

  function arrow(x0, y0, x1, y1, col, lw) {
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
    if (L < 2) return;
    const ux = dx / L, uy = dy / L, h = Math.min(14, L * 0.45);
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = lw || 3;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - ux * h * 0.8, y1 - uy * h * 0.8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - ux * h - uy * h * 0.45, y1 - uy * h + ux * h * 0.45);
    ctx.lineTo(x1 - ux * h + uy * h * 0.45, y1 - uy * h - ux * h * 0.45); ctx.closePath(); ctx.fill();
  }

  function label(t, x, y, col, size, align, bold) {
    ctx.fillStyle = col;
    drawSub(ctx, t, x, y, Math.round((size || 15) * S.fs), "-apple-system, Segoe UI, Arial", align || "left", bold ? "600" : "");
  }

  // Farbe aufhellen (amt > 0) oder abdunkeln (amt < 0)
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const f = c => Math.round(amt >= 0 ? c + (255 - c) * amt : c * (1 + amt));
    return "rgb(" + f(n >> 16) + "," + f((n >> 8) & 255) + "," + f(n & 255) + ")";
  }

  // ---------- plastische Darstellung ----------
  function plate3D(cx, cy, R) {
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 26; ctx.shadowOffsetY = 12;
    const rim = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
    rim.addColorStop(0, "#f4f6f9"); rim.addColorStop(0.45, "#a9b3c0"); rim.addColorStop(0.55, "#8e99a7"); rim.addColorStop(1, "#d9dfe6");
    ctx.fillStyle = rim; ctx.beginPath(); ctx.arc(cx, cy, R + 12, 0, 2 * Math.PI); ctx.fill();
    ctx.restore();
    const top = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.05, cx, cy, R * 1.05);
    top.addColorStop(0, "#ffffff"); top.addColorStop(0.6, "#e6ecf3"); top.addColorStop(1, "#c4cfdc");
    ctx.fillStyle = top; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 1; ctx.stroke();
    // Glanzlicht
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI); ctx.clip();
    const gl = ctx.createLinearGradient(cx - R, cy - R, cx, cy);
    gl.addColorStop(0, "rgba(255,255,255,.55)"); gl.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = gl; ctx.beginPath(); ctx.ellipse(cx - R * 0.35, cy - R * 0.45, R * 0.75, R * 0.35, -0.6, 0, 2 * Math.PI); ctx.fill();
    ctx.restore();
  }

  function hub3D(cx, cy, phi) {
    const r = 17;
    ctx.save(); ctx.shadowColor = "rgba(0,0,0,.4)"; ctx.shadowBlur = 8; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 4;
    const g = ctx.createRadialGradient(cx - 5, cy - 6, 2, cx, cy, r);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.5, "#b8c1cc"); g.addColorStop(1, "#5d6876");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.fill(); ctx.restore();
    ctx.strokeStyle = "#4a5562"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.stroke();
    // Markierung dreht sich mit der Achse
    ctx.strokeStyle = "#C0392B"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 13 * Math.cos(-phi), cy + 13 * Math.sin(-phi)); ctx.stroke(); ctx.lineCap = "butt";
    const g2 = ctx.createRadialGradient(cx - 1.5, cy - 1.5, 0.5, cx, cy, 5);
    g2.addColorStop(0, "#eee"); g2.addColorStop(1, "#333");
    ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(cx, cy, 5, 0, 2 * Math.PI); ctx.fill();
  }

  function string3D(x0, y0, x1, y1) {
    ctx.strokeStyle = "rgba(0,0,0,.18)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x0 + 3, y0 + 4); ctx.lineTo(x1 + 3, y1 + 4); ctx.stroke();
    ctx.strokeStyle = "#5a4630"; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.strokeStyle = "rgba(255,240,210,.55)"; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }

  function sphere3D(X, Y, rad, col) {
    ctx.save(); ctx.filter = "blur(3px)";
    ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.beginPath(); ctx.ellipse(X + rad * 0.35, Y + rad * 0.5, rad * 1.0, rad * 0.8, 0, 0, 2 * Math.PI); ctx.fill();
    ctx.restore();
    const g = ctx.createRadialGradient(X - rad * 0.38, Y - rad * 0.42, rad * 0.08, X, Y, rad);
    g.addColorStop(0, shade(col, 0.75)); g.addColorStop(0.35, col); g.addColorStop(1, shade(col, -0.55));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X, Y, rad, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.beginPath(); ctx.ellipse(X - rad * 0.38, Y - rad * 0.45, rad * 0.22, rad * 0.14, -0.6, 0, 2 * Math.PI); ctx.fill();
  }

  // ---------- Maßstab und Pfeil-Legenden ----------
  function scaleBar(scale, H) {
    const x0 = 16, y = H - 20, L = 0.5 * scale;
    ctx.strokeStyle = "#1d2733"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + L, y);
    ctx.moveTo(x0, y - 7); ctx.lineTo(x0, y + 7); ctx.moveTo(x0 + L, y - 7); ctx.lineTo(x0 + L, y + 7);
    ctx.moveTo(x0 + L / 2, y - 4); ctx.lineTo(x0 + L / 2, y + 4); ctx.stroke();
    label("0,5 m", x0 + L / 2, y - 11, "#1d2733", 14, "center", true);
    label("Ringabstand 0,1 m", x0, y - 11 - 20 * S.fs, "#5b6675", 12);
  }

  function legends(p, scale, W, H, turns) {
    const xr = W - 16; let y = H - 16;
    label("Umläufe: " + Math.max(0, turns), xr, y, "#5b6675", 14, "right");
    y -= 26 * S.fs;
    if (S.mode === "force" && p.f) {
      const L = 0.30 * scale;               // 5 N
      arrow(xr - L, y - 5, xr, y - 5, C.blue, 3);
      label("5 N", xr - L - 8, y, C.blue, 13, "right", true);
      y -= 24 * S.fs;
    }
    if (p.v) {
      const L = 2 * 0.35 * scale / 3;       // 2 m/s
      arrow(xr - L, y - 5, xr, y - 5, C.red, 3);
      label("2 m/s", xr - L - 8, y, C.red, 13, "right", true);
    }
  }

  function draw() {
    const p = P(), three = S.view === "3d";
    const W = cv.clientWidth, H = cv.clientHeight;
    ctx.clearRect(0, 0, W, H);
    if (three) {
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#eef2f7"); bg.addColorStop(1, "#d5dde7");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    }
    const cx = W / 2, cy = H / 2;
    const scale = Math.min(W, H) * 0.40 / 1.0;   // fester Maßstab: 1,0 m = 40 % der kleineren Seite
    if (three) plate3D(cx, cy, 1.05 * scale);
    else { ctx.fillStyle = "#e9eef5"; ctx.beginPath(); ctx.arc(cx, cy, 1.05 * scale, 0, 2 * Math.PI); ctx.fill(); }
    ctx.strokeStyle = three ? "rgba(31,78,121,.22)" : "#c4cfdc"; ctx.lineWidth = 1;
    for (let k = 1; k <= 10; k++) { ctx.beginPath(); ctx.arc(cx, cy, k * 0.1 * scale, 0, 2 * Math.PI); ctx.stroke(); }

    const bodies = [{ r:p.r1, col:C.orange, name:"1" }];
    if (p.two) bodies.push({ r:p.r2, col:C.purple, name:"2" });
    const phi = S.phi;
    const turns = Math.floor(phi / (2 * Math.PI));
    const phiMod = phi - turns * 2 * Math.PI;

    if (p.arc) {
      // Bezugslinie und Winkel
      ctx.strokeStyle = "#555"; ctx.lineWidth = 1.2; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 1.02 * scale, cy); ctx.stroke(); ctx.setLineDash([]);
      for (const b of bodies) {
        if (b.name === "2" && S.released) continue;
        ctx.strokeStyle = C.green; ctx.lineWidth = 5; ctx.globalAlpha = 0.8;
        ctx.beginPath(); ctx.arc(cx, cy, b.r * scale, 0, -phiMod, true); ctx.stroke(); ctx.globalAlpha = 1;
      }
      ctx.strokeStyle = C.blue; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, 0.07 * scale + 14, 0, -phiMod, true); ctx.stroke();
      const lr = 0.07 * scale + 28;
      label("φ", cx + lr * Math.cos(-phiMod / 2), cy + lr * Math.sin(-phiMod / 2) + 6, C.blue, 18, "center");
    }

    // Lage und Geschwindigkeit der Körper
    for (const b of bodies) {
      const v = p.w * b.r;
      b.free = b.name === "2" && S.released && S.rel;
      if (b.free) { b.x = S.rel.x; b.y = S.rel.y; b.vx = S.rel.vx; b.vy = S.rel.vy; }
      else { b.x = b.r * Math.cos(phi); b.y = b.r * Math.sin(phi); b.vx = -v * Math.sin(phi); b.vy = v * Math.cos(phi); }
      b.X = cx + b.x * scale; b.Y = cy - b.y * scale;
    }
    // Fäden bzw. Flugbahn
    for (const b of bodies) {
      if (b.free) {
        ctx.strokeStyle = C.grey; ctx.setLineDash([3, 5]); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(cx + S.rel.x0 * scale, cy - S.rel.y0 * scale); ctx.lineTo(b.X, b.Y); ctx.stroke(); ctx.setLineDash([]);
      } else if (three) string3D(cx, cy, b.X, b.Y);
      else { ctx.strokeStyle = "#444"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(b.X, b.Y); ctx.stroke(); }
    }
    if (three) hub3D(cx, cy, phi);
    else { ctx.fillStyle = "#333"; ctx.beginPath(); ctx.arc(cx, cy, 4, 0, 2 * Math.PI); ctx.fill(); }

    for (const b of bodies) {
      const X = b.X, Y = b.Y, tags = [];
      if (p.v) {
        const k = 0.35 * scale / 3;  // 3 m/s = 0,35 m Bildlänge
        arrow(X, Y, X + b.vx * k, Y - b.vy * k, C.red, 3);
        tags.push(["v_" + b.name, X + b.vx * k + 6, Y - b.vy * k - 6, C.red]);
      }
      if (S.mode === "force" && p.f && !b.free) {
        const F = p.m * p.w * p.w * b.r;
        const k = 0.30 * scale / 5;  // 5 N = 0,30 m Bildlänge
        const ux = -Math.cos(phi), uy = -Math.sin(phi);
        arrow(X, Y, X + ux * F * k, Y - uy * F * k, C.blue, 3);
        if (F * k > 12) tags.push(["F_Z", X + ux * F * k * 0.5 + 8, Y - uy * F * k * 0.5 - 8, C.blue]);
      }
      const rad = S.mode === "force" ? 8 + 10 * Math.sqrt(p.m) : 11;
      if (three) sphere3D(X, Y, rad, b.col);
      else {
        ctx.fillStyle = b.col; ctx.strokeStyle = "#222"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(X, Y, rad, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
      }
      label(b.name, X, Y + 5 * S.fs, "#fff", 13, "center", true);
      for (const t of tags) label(t[0], t[1], t[2], t[3], 16);
    }
    scaleBar(scale, H);
    legends(p, scale, W, H, turns);
    if (S.released) label("Körper 2 ohne Faden: Er bewegt sich geradeaus weiter (Trägheit).", W / 2, 76, C.red, 16, "center", true);
  }

  function table() {
    const p = P();
    const T = p.w > 0 ? 2 * Math.PI / p.w : Infinity, f = p.w / (2 * Math.PI);
    const phiMod = ((S.phi % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
    const rows = [];
    rows.push(["<th></th>", "<th class='k1'>Körper 1</th>", p.two ? "<th class='k2'>Körper 2</th>" : ""]);
    rows.push(["φ (aktueller Umlauf)", fmt(phiMod, 2) + " rad = " + fmt(phiMod * 180 / Math.PI, 0) + "°", ""]);
    rows.push(["Bogen s = φ · r", fmt(phiMod * p.r1, 2) + " m", p.two ? fmt(phiMod * p.r2, 2) + " m" : ""]);
    rows.push(["ω", fmt(p.w, 2) + " Hz", ""]);
    rows.push(["T  /  f", (isFinite(T) ? fmt(T, 2) + " s" : "–") + " / " + fmt(f, 2) + " Hz", ""]);
    rows.push(["Bahngeschw. v", fmt(p.w * p.r1, 2) + " m/s", p.two ? fmt(p.w * p.r2, 2) + " m/s" : ""]);
    if (S.mode === "force") {
      rows.push(["Beschl. a = ω² · r", fmt(p.w * p.w * p.r1, 2) + " m/s²", p.two ? fmt(p.w * p.w * p.r2, 2) + " m/s²" : ""]);
      rows.push(["Kraft F<sub>Z</sub>", fmt(p.m * p.w * p.w * p.r1, 3) + " N", p.two ? fmt(p.m * p.w * p.w * p.r2, 3) + " N" : ""]);
    }
    const html = rows.map((r, i) => i === 0 ? "<tr>" + r.join("") + "</tr>" :
      "<tr><td>" + r[0] + "</td><td class='k1'>" + r[1] + "</td><td class='k2'>" + r[2] + "</td></tr>").join("");
    if (html !== table.last) { $("vals").innerHTML = html; table.last = html; }
    $("r1o").textContent = fmt(p.r1, 2) + " m"; $("r2o").textContent = fmt(p.r2, 2) + " m";
    $("wo").textContent = fmt(p.w, 1) + " Hz"; $("mo").textContent = fmt(p.m, 2) + " kg";
    $("r2").disabled = !p.two;
  }

  function xval(d, key) { return { w:d.w, w2:d.w * d.w, r:d.r, m:d.m, v:d.v, v2:d.v * d.v }[key]; }

  function drawPlot() {
    const W = pc.clientWidth, H = pc.clientHeight;
    pctx.clearRect(0, 0, W, H);
    if (!W) return;
    const fsz = Math.round(11 * S.fs);
    const key = $("xsel").value;
    const pts = S.data.map(d => [xval(d, key), d.F]);
    const xmax = Math.max(1e-9, ...pts.map(q => q[0])) * 1.15, ymax = Math.max(1e-9, ...pts.map(q => q[1])) * 1.15;
    const L = 40 * S.fs, B = 24 * S.fs, R = 8, T = 8;
    pctx.strokeStyle = "#888"; pctx.lineWidth = 1;
    pctx.beginPath(); pctx.moveTo(L, T); pctx.lineTo(L, H - B); pctx.lineTo(W - R, H - B); pctx.stroke();
    pctx.fillStyle = "#5b6675"; pctx.font = fsz + "px -apple-system, Arial";
    pctx.textAlign = "left"; pctx.fillText("F in N", L + 5, T + fsz - 2); pctx.textAlign = "right";
    pctx.fillText(fmt(ymax / 1.15, 2), L - 3, H - B - (H - B - T) / 1.15 + 4);
    pctx.textAlign = "right"; pctx.fillText($("xsel").selectedOptions[0].text, W - R, H - 6);
    pctx.textAlign = "left"; pctx.fillText("0", L - 2, H - B + fsz + 2);
    pctx.textAlign = "center"; pctx.fillText(fmt(xmax / 1.15, 2), L + (W - R - L) / 1.15, H - B - 5);
    if (!pts.length) { pctx.fillText("Noch keine Messwerte", W / 2, H / 2); return; }
    pctx.fillStyle = "#1F4E79";
    for (const [x, y] of pts) {
      const X = L + x / xmax * (W - R - L), Y = H - B - y / ymax * (H - B - T);
      pctx.beginPath(); pctx.arc(X, Y, 4, 0, 2 * Math.PI); pctx.fill();
    }
  }

  function mtable() {
    if (!S.data.length) { $("mtable").innerHTML = ""; return; }
    $("mtable").innerHTML = "<table><tr><th>m</th><th>r</th><th>ω</th><th>v</th><th>F</th></tr>" +
      S.data.map(d => `<tr><td>${fmt(d.m, 2)}</td><td>${fmt(d.r, 2)}</td><td>${fmt(d.w, 1)}</td><td>${fmt(d.v, 2)}</td><td>${fmt(d.F, 3)}</td></tr>`).join("") + "</table>";
  }

  function setMode(m) {
    S.mode = m;
    $("tabDesc").classList.toggle("on", m === "desc"); $("tabForce").classList.toggle("on", m === "force");
    document.querySelectorAll(".force").forEach(e => e.classList.toggle("hidden", m !== "force"));
    $("plotwrap").style.display = m === "force" ? "flex" : "none";
    if (m === "desc") unrelease();
    resize(); table();
  }

  function unrelease() { S.released = false; S.rel = null; $("release").textContent = "Faden von Körper 2 loslassen"; }

  // ---------- Schriftgröße, Ansicht, Bedienfeld, Vollbild ----------
  function setFs(v) {
    S.fs = Math.max(0.8, Math.min(1.6, Math.round(v * 10) / 10));
    document.documentElement.style.fontSize = (14 * S.fs) + "px";
    store.set("kreis_fs", S.fs);
    resize();
  }
  function setView(v) {
    S.view = v;
    $("view").textContent = v === "3d" ? "Symbol" : "3D";
    $("view").title = v === "3d" ? "Zur Symbolansicht wechseln" : "Zur 3D-Ansicht wechseln";
    store.set("kreis_view", v);
  }
  $("fsMinus").onclick = () => setFs(S.fs - 0.1);
  $("fsPlus").onclick = () => setFs(S.fs + 0.1);
  $("view").onclick = () => setView(S.view === "3d" ? "sym" : "3d");
  $("panelBtn").onclick = () => { document.body.classList.toggle("nopanel"); resize(); };
  const de = document.documentElement;
  const reqFS = de.requestFullscreen || de.webkitRequestFullscreen;
  if (!reqFS) $("full").classList.add("hidden");
  $("full").onclick = () => {
    const cur = document.fullscreenElement || document.webkitFullscreenElement;
    if (cur) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else reqFS.call(de);
  };
  $("rotGo").onclick = () => document.body.classList.add("quer");

  $("tabDesc").onclick = () => setMode("desc");
  $("tabForce").onclick = () => setMode("force");
  $("play").onclick = () => { S.running = !S.running; $("play").textContent = S.running ? "Pause" : "Start"; $("play").classList.toggle("on", S.running); };
  $("reset").onclick = () => { S.phi = 0; unrelease(); };
  $("release").onclick = () => {
    const p = P();
    if (S.released) { unrelease(); return; }
    if (!p.two) $("cb2").checked = true;
    const x = p.r2 * Math.cos(S.phi), y = p.r2 * Math.sin(S.phi), v = p.w * p.r2;
    S.rel = { x, y, x0:x, y0:y, vx:-v * Math.sin(S.phi), vy:v * Math.cos(S.phi) };
    S.released = true; $("release").textContent = "Körper 2 wieder einhängen";
  };
  $("measure").onclick = () => { const p = P(); S.data.push({ m:p.m, r:p.r1, w:p.w, v:p.w * p.r1, F:p.m * p.w * p.w * p.r1 }); mtable(); drawPlot(); };
  $("clear").onclick = () => { S.data = []; mtable(); drawPlot(); };
  $("xsel").onchange = drawPlot;
  document.querySelectorAll("input").forEach(e => e.addEventListener("input", table));
  window.addEventListener("resize", resize);
  if (window.ResizeObserver) { const ro = new ResizeObserver(resize); ro.observe(cv); ro.observe(pc); }

  let last = performance.now();
  function loop(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    const p = P();
    if (S.running) {
      S.phi += p.w * dt;
      if (S.released && S.rel) {
        if (Math.hypot(S.rel.x, S.rel.y) < 1.25) { S.rel.x += S.rel.vx * dt; S.rel.y += S.rel.vy * dt; }
      }
    }
    draw(); table();
    requestAnimationFrame(loop);
  }
  setView(store.get("kreis_view") === "sym" ? "sym" : "3d");
  setFs(+store.get("kreis_fs") || 1);
  setMode("desc");
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
