<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gravitationslabor: Wovon hängt die Gravitationskraft ab?</title>
<style>
  :root { --bg:#f4f6f9; --panel:#ffffff; --ink:#1d2733; --muted:#5b6675; --line:#d5dbe3;
          --blue:#1F4E79; --red:#C0392B; --green:#2E7D32; }
  * { box-sizing:border-box; }
  html { font-size:14px; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
               font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow:hidden;
               -webkit-text-size-adjust:100%; }
  #app { display:flex; height:100vh; height:100dvh; width:100vw; }
  #stage { flex:1 1 auto; position:relative; min-width:0; min-height:0; background:#20262e; }
  #cv { position:absolute; inset:0; display:block; width:100%; height:100%; touch-action:none; }
  #panel { flex:0 0 24rem; max-width:50vw; background:var(--panel); border-left:1px solid var(--line);
           padding:.6rem .85rem; display:flex; flex-direction:column; gap:.45rem; overflow-y:auto; }
  body.nopanel #panel { display:none; }
  #ctrl, #info { display:flex; flex-direction:column; gap:.45rem; min-width:0; }
  h1 { font-size:1.2rem; margin:0; color:var(--blue); }
  .tabs { display:flex; gap:6px; }
  .tabs button { flex:1; }
  button { font:inherit; font-size:1rem; padding:.5rem .6rem; border-radius:8px; border:1px solid var(--line);
           background:#eef2f7; color:var(--ink); cursor:pointer; touch-action:manipulation; min-height:2.6rem; }
  button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  .par { display:flex; flex-direction:column; gap:.15rem; }
  .par .head { display:flex; justify-content:space-between; align-items:baseline; font-size:1rem; }
  .par .head output { font-weight:600; font-variant-numeric:tabular-nums; }
  .par .line { display:flex; align-items:center; gap:6px; }
  .par .line button { flex:0 0 2.7rem; padding:0; font-size:1.3rem; font-weight:600; }
  .par input[type=range] { flex:1; min-width:0; height:2rem; }
  .row { display:flex; align-items:center; gap:8px; font-size:1rem; }
  .row label { flex:0 0 auto; }
  select { font:inherit; font-size:1rem; padding:.3rem; flex:1; min-width:0; }
  .checks { display:flex; flex-wrap:wrap; gap:.3rem .9rem; font-size:1rem; }
  .checks label { display:flex; align-items:center; gap:5px; min-height:1.9rem; }
  .checks input { width:1.3rem; height:1.3rem; }
  .btns { display:flex; gap:6px; }
  .btns button { flex:1; }
  #expl { font-size:.95rem; background:#f1f6fc; border:1px solid #d3e2f3; border-radius:8px; padding:.4rem .55rem; line-height:1.35; }
  #notes table { border-collapse:collapse; width:100%; font-size:.95rem; font-variant-numeric:tabular-nums; }
  #notes td, #notes th { border-bottom:1px solid var(--line); padding:.2rem .3rem; text-align:right; white-space:nowrap; }
  #notes th { color:var(--muted); font-weight:600; font-size:.85rem; vertical-align:bottom; white-space:normal; }
  #notes td:first-child, #notes th:first-child { text-align:left; color:var(--muted); }
  #notes .empty { font-size:.9rem; color:var(--muted); }
  #noteBtn { background:var(--green); color:#fff; border-color:var(--green); font-weight:600; }
  details.small summary { cursor:pointer; min-height:1.9rem; display:flex; align-items:center; }
  .small { font-size:.86rem; color:var(--muted); line-height:1.35; }
  .hidden { display:none !important; }

  /* Werkzeugleiste auf der Simulation */
  #tools { position:absolute; top:8px; right:8px; display:flex; gap:6px; z-index:5; }
  #tools button { min-width:44px; height:44px; min-height:44px; padding:0 10px; font-size:16px; font-weight:600;
                  background:rgba(255,255,255,.88); border:1px solid #c3ccd8; border-radius:10px;
                  box-shadow:0 2px 6px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center; }
  #tools button svg { width:22px; height:22px; stroke:var(--ink); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #tools button:active { background:#dde5ef; }

  @media (max-height: 800px) {
    h1 { display:none; }
    button { padding:.35rem .6rem; min-height:2.4rem; }
    .par input[type=range] { height:1.7rem; }
    .checks label { min-height:1.6rem; }
  }
  @media (max-width: 900px) and (orientation: landscape) { #panel { flex-basis:21rem; } }

  /* iPad hochkant: Simulation oben, Bedienfeld zweispaltig darunter */
  @media (min-width: 641px) and (max-width: 900px) and (orientation: portrait) {
    #app { flex-direction:column; }
    #panel { flex:0 0 auto; max-width:none; max-height:46vh; width:100%; border-left:0; border-top:1px solid var(--line);
             display:grid; grid-template-columns:1fr 1fr; gap:.4rem 1.1rem; align-items:start; }
    h1 { display:none; }
  }

  /* Handy hochkant: Simulation oben, Bedienfeld darunter, Seite darf scrollen */
  @media (max-width: 640px) {
    html, body { height:auto; overflow:auto; }
    #app { flex-direction:column; height:auto; min-height:100vh; }
    #stage { flex:none; height:min(115vw, 62vh); }
    body.nopanel #stage { height:100vh; height:100dvh; }
    #panel { flex:none; width:100%; max-width:none; border-left:0; border-top:1px solid var(--line); overflow:visible; }
    h1 { display:block; }
    #tools button { min-width:40px; height:40px; min-height:40px; padding:0 8px; }
  }

  /* Drehhinweis, wenn das Handy quer gehalten wird */
  #rotate { display:none; position:fixed; inset:0; z-index:50; background:rgba(29,39,51,.94); color:#fff;
            align-items:center; justify-content:center; text-align:center; padding:20px; }
  #rotate .box { max-width:420px; display:flex; flex-direction:column; align-items:center; gap:14px; font-size:18px; }
  #rotate svg { width:80px; height:80px; stroke:#fff; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  #rotate button { font-size:17px; background:#fff; color:var(--ink); padding:10px 18px; }
  @media (orientation: landscape) and (max-height: 500px) {
    body:not(.quer) #rotate { display:flex; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="tools">
      <button id="fsMinus" title="Schrift kleiner">A−</button>
      <button id="fsPlus" title="Schrift größer">A+</button>
      <button id="view" title="Darstellung umschalten">Symbol</button>
      <button id="full" title="Vollbild"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button id="panelBtn" title="Bedienfeld aus-/einblenden"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
    </div>
  </div>
  <div id="panel">
    <div id="ctrl">
      <h1>Gravitationslabor</h1>
      <div class="tabs">
        <button id="tabLab" class="on">Labor</button>
        <button id="tabSpace">Weltall</button>
      </div>
      <div class="par" data-k="m1">
        <div class="head"><span>Masse m<sub>1</sub> (links)</span><output></output></div>
        <div class="line"><button class="minus">−</button><input type="range"><button class="plus">+</button></div>
      </div>
      <div class="par" data-k="m2">
        <div class="head"><span>Masse m<sub>2</sub> (rechts)</span><output></output></div>
        <div class="line"><button class="minus">−</button><input type="range"><button class="plus">+</button></div>
      </div>
      <div class="par" data-k="r">
        <div class="head"><span>Abstand r der Mittelpunkte</span><output></output></div>
        <div class="line"><button class="minus">−</button><input type="range"><button class="plus">+</button></div>
      </div>
    </div>
    <div id="info">
      <div class="checks">
        <label><input id="cbArrow" type="checkbox" checked>Kraftpfeile</label>
        <label class="lab"><input id="cbNoise" type="checkbox">Messrauschen</label>
        <label class="space"><input id="cbMag" type="checkbox" checked>Körper 5× vergrößert</label>
      </div>
      <div class="row arrowrow"><label>Pfeilmaßstab</label><select id="arrowScale"></select></div>
      <div class="btns">
        <button id="preset" class="space">Erde und Mond</button>
        <button id="reset">Zurücksetzen</button>
      </div>
      <div id="expl"></div>
      <div class="btns">
        <button id="noteBtn">Messwert notieren</button>
        <button id="noteUndo" title="Letzte Zeile löschen">Letzten löschen</button>
        <button id="noteClear" title="Alle Messwerte löschen">Alle löschen</button>
      </div>
      <div id="notes"></div>
      <details class="small"><summary>Hinweise und Vereinfachungen</summary><div id="simpl"></div></details>
    </div>
  </div>
</div>
<div id="rotate">
  <div class="box">
    <svg viewBox="0 0 64 64"><rect x="20" y="6" width="24" height="42" rx="4"/><path d="M29 42h6"/><path d="M50 30a20 20 0 0 1-12 22M38 52l1-6M38 52l-6-1"/></svg>
    <div>Bitte das Handy hochkant halten.</div>
    <button id="rotGo">Trotzdem quer weiter</button>
  </div>
</div>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const G = 6.674e-11;                 // Gravitationskonstante in N·m²/kg²
  const FONT = "-apple-system, 'Segoe UI', Roboto, Arial, sans-serif";
  const SUP = { "-":"⁻", "0":"⁰", "1":"¹", "2":"²", "3":"³", "4":"⁴", "5":"⁵", "6":"⁶", "7":"⁷", "8":"⁸", "9":"⁹" };
  const sup = n => String(n).split("").map(c => SUP[c]).join("");
  const de = (x, d) => x.toFixed(d).replace(".", ",");
  const thou = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");   // 380 000

  // ---------- Szenen: Wertebereiche und Einheiten ----------
  // Labor: Bleikugeln, r in cm, Kraft in nN. Weltall: m1 in 10^24 kg, m2 in 10^22 kg, r in km.
  const SCN = {
    lab: {
      par: { m1:{ min:1, max:10, step:1, def:5 }, m2:{ min:1, max:10, step:1, def:5 }, r:{ min:15, max:60, step:1, def:20 } },
      txt: { m1: v => v + " kg", m2: v => v + " kg", r: v => v + " cm" },
      si: p => ({ m1:p.m1, m2:p.m2, r:p.r / 100 }),
      rho1: 11340, rho2: 11340,           // Blei
      unitLen: 10, unitTxt: "10 cm",      // Längeneinheit der Welt: cm
      scales: [ { v:5, t:"10 cm Pfeil ≙ 5 nN" }, { v:20, t:"10 cm Pfeil ≙ 20 nN" }, { v:100, t:"10 cm Pfeil ≙ 100 nN" } ], defScale:1
    },
    space: {
      par: { m1:{ min:1, max:20, step:1, def:6 }, m2:{ min:1, max:20, step:1, def:7 }, r:{ min:100000, max:500000, step:10000, def:380000 } },
      txt: { m1: v => v + " · 10" + sup(24) + " kg", m2: v => v + " · 10" + sup(22) + " kg", r: v => thou(v) + " km" },
      si: p => ({ m1:p.m1 * 1e24, m2:p.m2 * 1e22, r:p.r * 1000 }),
      rho1: 5500, rho2: 3300,             // Gesteinsplanet, Mond
      unitLen: 100000, unitTxt: "100 000 km",   // Längeneinheit der Welt: km
      scales: [ { v:0.1, t:"100 000 km Pfeil ≙ 0,1 · 10²⁰ N" }, { v:1, t:"100 000 km Pfeil ≙ 1 · 10²⁰ N" },
                { v:10, t:"100 000 km Pfeil ≙ 10 · 10²⁰ N" }, { v:100, t:"100 000 km Pfeil ≙ 100 · 10²⁰ N" } ], defScale:1
    }
  };
  const S = { scene:"lab", view:"3d", fs:1, k:1, drag:false, noise:0,
              val:{ lab:{}, space:{} }, scale:{ lab:SCN.lab.defScale, space:SCN.space.defScale } };
  for (const s in SCN) for (const k in SCN[s].par) S.val[s][k] = SCN[s].par[k].def;

  const P = () => S.val[S.scene];
  const C = () => SCN[S.scene];
  function force() { const q = C().si(P()); return G * q.m1 * q.m2 / (q.r * q.r); }   // in N
  // Radius einer homogenen Kugel aus Masse und Dichte, in Welt-Einheiten (cm bzw. km)
  function radius(m, rho) { const R = Math.cbrt(3 * m / (4 * Math.PI * rho)); return S.scene === "lab" ? R * 100 : R / 1000; }
  function radii() {
    const q = C().si(P()), mag = S.scene === "space" && $("cbMag").checked ? 5 : 1;
    return [radius(q.m1, C().rho1) * mag, radius(q.m2, C().rho2) * mag];
  }

  // ---------- Zeichenhilfen ----------
  function resize() {
    const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function txt(s, x, y, size, col, align, bold) {   // Text mit echten Indizes: "m_1", "F_{auf 2}"
    const parts = [];
    s.split(/(_\{[^}]*\}|_[0-9A-Za-z])/).forEach(q => { if (q) parts.push(q[0] === "_" ? [q.replace(/^_\{?|\}$/g, ""), true] : [q, false]); });
    const font = q => (bold ? "600 " : "") + Math.round(q[1] ? size * 0.7 : size) + "px " + FONT;
    let w = 0; for (const q of parts) { ctx.font = font(q); w += ctx.measureText(q[0]).width; }
    let cx = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
    ctx.fillStyle = col; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    for (const q of parts) { ctx.font = font(q); ctx.fillText(q[0], cx, q[1] ? y + size * 0.28 : y); cx += ctx.measureText(q[0]).width; }
    return w;
  }
  function rrect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function arrow(x1, y, x2, col, lw, outline) {
    const dir = Math.sign(x2 - x1) || 1, len = Math.abs(x2 - x1), head = Math.min(len, lw * 3.2);
    const draw1 = (c, w) => {
      ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = w; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2 - dir * head * 0.8, y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x2, y); ctx.lineTo(x2 - dir * head, y - head * 0.6); ctx.lineTo(x2 - dir * head, y + head * 0.6); ctx.closePath(); ctx.fill();
      if (w > lw) ctx.stroke();
    };
    if (len < 0.5) return;
    if (outline) draw1(outline, lw + 3);
    draw1(col, lw);
  }
  // Bemaßungslinie mit Endstrichen
  function dim(x1, x2, y, label, col, fz) {
    ctx.strokeStyle = col; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y);
    ctx.moveTo(x1, y - 7); ctx.lineTo(x1, y + 7); ctx.moveTo(x2, y - 7); ctx.lineTo(x2, y + 7); ctx.stroke();
    ctx.fillStyle = col;
    for (const [x, d] of [[x1, 1], [x2, -1]]) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + d * 8, y - 4); ctx.lineTo(x + d * 8, y + 4); ctx.closePath(); ctx.fill(); }
    txt(label, (x1 + x2) / 2, y - fz * 0.8, fz, col, "center", true);
  }
  // Kugel mit Glanz und Schatten
  function ball(x, y, R, base, light, dark) {
    const g = ctx.createRadialGradient(x - R * 0.38, y - R * 0.42, R * 0.08, x, y, R);
    g.addColorStop(0, light); g.addColorStop(0.45, base); g.addColorStop(1, dark);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill();
  }
  function metalV(x, y, w, h) {   // senkrechte Metallstange
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, "#7d8794"); g.addColorStop(0.35, "#e9eef3"); g.addColorStop(1, "#59626d");
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  }

  // Zufallssterne (fest, damit nichts flackert)
  const STARS = []; { let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 220; i++) STARS.push([rnd(), rnd(), rnd()]); }

  // ---------- Hauptzeichnung ----------
  function draw() {
    const W = cv.clientWidth, H = cv.clientHeight; if (!W || !H) return;
    const lab = S.scene === "lab", d3 = S.view === "3d", p = P(), c = C();
    const fz = Math.max(12, Math.min(17, W / 48)) * S.fs;
    const ink = d3 ? "#f2f5f8" : "#1d2733", sub = d3 ? "rgba(242,245,248,.75)" : "#5b6675";
    const red = d3 ? "#ff5a47" : "#C0392B";
    const [R1, R2] = radii();

    // Maßstab fest: aus der größten möglichen Anordnung, nicht aus den aktuellen Werten
    const rmax = c.par.r.max;
    const left = lab ? 14 : 62000, right = lab ? 34 : 50000;     // Platz links von m1 bzw. rechts von m2
    const pad = 16, k = (W - 2 * pad) / (left + rmax + right);
    S.k = k;
    const x1 = pad + left * k, x2 = x1 + p.r * k;
    S.x1 = x1;

    // Höhen
    const devH = fz * 6.2;
    const yc = lab ? Math.max(devH + 70 + 50 * k * 0 + 40, H * 0.58) : Math.max(devH + 60 + 60, H * 0.56);
    S.yc = yc;
    const r1 = R1 * k, r2 = R2 * k;

    // Hintergrund
    if (d3) {
      if (lab) {
        const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#3a4350"); g.addColorStop(1, "#262c35");
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      } else {
        ctx.fillStyle = "#05070d"; ctx.fillRect(0, 0, W, H);
        for (const [a, b, s] of STARS) { ctx.fillStyle = "rgba(255,255,255," + (0.25 + s * 0.6) + ")"; ctx.fillRect(a * W, b * H, s > 0.85 ? 2 : 1.2, s > 0.85 ? 2 : 1.2); }
      }
    } else { ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H); }

    if (lab) drawLab(W, H, k, x1, x2, yc, r1, r2, d3, fz, ink, sub);
    else drawSpace(W, H, k, x1, x2, yc, r1, r2, d3, fz, ink, sub);

    // Massenangaben
    // Bei kleinem Abstand werden die Beschriftungen gestaffelt, damit sie sich nicht überdecken
    ctx.font = "600 " + Math.round(fz) + "px " + FONT;
    const lw1 = ctx.measureText("m1 = " + c.txt.m1(p.m1)).width, lw2 = ctx.measureText("m2 = " + c.txt.m2(p.m2)).width;
    const al1 = x1 - lw1 / 2 < 4 ? "left" : "center", e1 = al1 === "left" ? x1 - 10 + lw1 : x1 + lw1 / 2;
    const stack = x2 - lw2 / 2 < e1 + 10, step = fz * 1.35 * (lab ? -1 : 1);
    const ylab = lab ? yc - Math.max(r1, r2) - fz * 1.7 : yc + Math.max(r1, r2, 8) + fz * 1.2;
    txt("m_1 = " + c.txt.m1(p.m1), al1 === "left" ? x1 - 10 : x1, ylab, fz, ink, al1, true);
    txt("m_2 = " + c.txt.m2(p.m2), x2, ylab + (stack ? step : 0), fz, ink, "center", true);
    // Abstand
    const ydim = yc - Math.max(r1, r2, 8) - fz * (lab ? (stack ? 4.6 : 3.3) : 2.2);
    dim(x1, x2, ydim, "r = " + c.txt.r(p.r), d3 ? "#ffd166" : "#1F4E79", fz);
    ctx.setLineDash([4, 4]); ctx.strokeStyle = d3 ? "rgba(255,209,102,.6)" : "rgba(31,78,121,.5)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x1, ydim + 7); ctx.lineTo(x1, yc); ctx.moveTo(x2, ydim + 7); ctx.lineTo(x2, yc); ctx.stroke(); ctx.setLineDash([]);
    // Mittelpunkte
    ctx.fillStyle = d3 ? "#ffd166" : "#1F4E79";
    for (const x of [x1, x2]) { ctx.beginPath(); ctx.arc(x, yc, 2.5, 0, 7); ctx.fill(); }

    // Kraftpfeile, fester Maßstab
    const F = force();
    const sc = c.scales[S.scale[S.scene]];
    const Funit = lab ? F * 1e9 : F / 1e20;                         // nN bzw. 10^20 N
    const L = Funit / sc.v * c.unitLen * k;                           // Länge in px
    if ($("cbArrow").checked) {
      const over = 2 * L > x2 - x1, off = over ? 6 : 0, lw = Math.max(3, fz * 0.28);
      const outline = d3 ? "rgba(0,0,0,.55)" : "#fff";
      const maxL = W - 6;
      const l1 = Math.min(L, maxL - x1), l2 = Math.min(L, x2 - 6);
      arrow(x1, yc - off, x1 + l1, red, lw, outline);
      arrow(x2, yc + off, x2 - l2, red, lw, outline);
      S.tooLong = L > l1 + 0.5 || L > l2 + 0.5;
      const lx1 = x1 + Math.max(l1, 14) / 2, lx2 = x2 - Math.max(l2, 14) / 2;
      txt("F", lx1, yc - off - fz * 0.95 - (lab ? 0 : 0), fz, red, "center", true);
      txt("F", lx2, yc + off + fz * 0.95, fz, red, "center", true);
    }

    // Maßstabsbalken und Pfeilmaßstab unten links
    const yb = H - fz * 1.0 - 6, bx = pad, ul = c.unitLen * k;
    ctx.strokeStyle = ink; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bx, yb); ctx.lineTo(bx + ul, yb); ctx.moveTo(bx, yb - 5); ctx.lineTo(bx, yb + 5); ctx.moveTo(bx + ul, yb - 5); ctx.lineTo(bx + ul, yb + 5); ctx.stroke();
    let tx = bx + ul + 8;
    tx += txt(c.unitTxt, tx, yb, fz * 0.85, ink, "left") + 18;
    if ($("cbArrow").checked) {
      arrow(tx, yb, tx + ul, red, Math.max(2.5, fz * 0.2), d3 ? "rgba(0,0,0,.5)" : null);
      txt("≙ " + (lab ? de(sc.v, 0) + " nN" : (sc.v < 1 ? de(sc.v, 1) : sc.v) + " · 10" + sup(20) + " N"), tx + ul + 8, yb, fz * 0.85, red, "left", true);
    }
    if (S.tooLong && $("cbArrow").checked) txt("Kraftpfeil zu lang für diesen Pfeilmaßstab: anderen wählen", bx, yb - fz * 1.5, fz * 0.85, red, "left", true);
    if (!lab && $("cbMag").checked) txt("Körper 5-fach vergrößert gezeichnet, Abstände nicht", bx, yb - fz * (S.tooLong && $("cbArrow").checked ? 2.9 : 1.5), fz * 0.8, sub, "left");

    drawMeter(W, fz, F, lab, d3);
  }

  function drawLab(W, H, k, x1, x2, yc, r1, r2, d3, fz, ink, sub) {
    const hc = 20 * k;                         // Mittelpunkte 20 cm über der Tischplatte
    const yt = yc + hc;                        // Tischkante hinten / Auflage
    const depth = Math.max(26, 9 * k);         // Tischtiefe (schräg gesehen)
    const xs = x2 + r2 + 5 * k;                // Kraftsensor links
    const sw = 11 * k, sh = 6 * k;
    if (d3) {
      // Tisch
      const g = ctx.createLinearGradient(0, yt, 0, yt + depth);
      g.addColorStop(0, "#9a6b43"); g.addColorStop(1, "#c08b5c");
      ctx.fillStyle = g; ctx.fillRect(0, yt, W, depth);
      ctx.fillStyle = "#6e4a2c"; ctx.fillRect(0, yt + depth, W, Math.max(10, 3 * k));
      ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(0, yt + depth + Math.max(10, 3 * k), W, 6);
      // Schatten der Aufbauten
      ctx.fillStyle = "rgba(0,0,0,.28)";
      for (const [x, w] of [[x1, 9 * k], [x2, 7 * k], [xs + sw / 2, 9 * k]]) { ctx.beginPath(); ctx.ellipse(x, yt + depth * 0.3, w, depth * 0.18, 0, 0, 7); ctx.fill(); }
    } else {
      ctx.strokeStyle = "#1d2733"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, yt); ctx.lineTo(W, yt); ctx.stroke();
      ctx.fillStyle = "rgba(29,39,51,.07)"; ctx.fillRect(0, yt, W, depth);
    }

    // Maßband auf dem Tisch, Nullpunkt unter dem Mittelpunkt von m1
    const ry = yt + depth * 0.5, rh = Math.max(16, fz * 1.25);
    const rx0 = x1 - 6 * k, rmax = SCN.lab.par.r.max, rx1 = x1 + (rmax + 4) * k;
    if (d3) {
      const g = ctx.createLinearGradient(0, ry, 0, ry + rh); g.addColorStop(0, "#ffe27a"); g.addColorStop(1, "#f2c230");
      ctx.fillStyle = g; ctx.fillRect(rx0, ry, rx1 - rx0, rh);
      ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(rx0, ry + rh, rx1 - rx0, 2);
    } else { ctx.strokeStyle = "#1d2733"; ctx.lineWidth = 1; ctx.strokeRect(rx0, ry, rx1 - rx0, rh); }
    ctx.strokeStyle = "#2b2b2b"; ctx.lineWidth = 1;
    const every = k >= 3 ? 1 : 2;
    for (let cm = -5; cm <= rmax + 4; cm += every) {
      const x = x1 + cm * k, long = cm % 10 === 0, mid = cm % 5 === 0;
      ctx.beginPath(); ctx.moveTo(x, ry); ctx.lineTo(x, ry + (long ? rh * 0.55 : mid ? rh * 0.38 : rh * 0.22)); ctx.stroke();
      if (long && cm >= 0 && cm <= rmax) {
        ctx.font = "600 " + Math.round(Math.min(rh * 0.42, fz * 0.75)) + "px " + FONT; ctx.fillStyle = "#2b2b2b"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
        ctx.fillText(String(cm), x + (cm === 0 ? 0 : 0), ry + rh - 2);
      }
    }
    ctx.font = Math.round(Math.min(rh * 0.42, fz * 0.7)) + "px " + FONT; ctx.textAlign = "left"; ctx.fillStyle = "#2b2b2b";
    ctx.textAlign = "right"; ctx.fillText("cm", x1 - 7, ry + rh - 2);
    // Ablesemarken unter den Kugelmitten
    for (const x of [x1, x2]) {
      ctx.strokeStyle = d3 ? "#c0392b" : "#C0392B"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, yt + 2); ctx.lineTo(x, ry + rh * 0.6); ctx.stroke();
    }

    // Stativ unter m1 (fest)
    const sb = Math.max(2.5 * k, 5);
    if (d3) {
      metalV(x1 - sb / 2, yc + r1 * 0.6, sb, yt - yc - r1 * 0.6);
      const g = ctx.createLinearGradient(0, yt - 2 * k, 0, yt); g.addColorStop(0, "#5d6670"); g.addColorStop(1, "#30363e");
      ctx.fillStyle = g; rrect(x1 - 7 * k, yt - 2 * k, 14 * k, 2 * k + 3, 3); ctx.fill();
    } else {
      ctx.strokeStyle = "#1d2733"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x1, yc + r1); ctx.lineTo(x1, yt); ctx.moveTo(x1 - 6 * k, yt); ctx.lineTo(x1 + 6 * k, yt); ctx.stroke();
    }

    // Wagen unter m2 (fast reibungsfrei), Stange zum Kraftsensor, Sensor auf eigenem Stativ
    const wy = yt - 3 * k, ww = 9 * k;
    if (d3) {
      metalV(x2 - sb / 2, yc + r2 * 0.6, sb, wy - yc - r2 * 0.6);
      let g = ctx.createLinearGradient(0, wy, 0, yt); g.addColorStop(0, "#5aa0d8"); g.addColorStop(1, "#1f5d93");
      ctx.fillStyle = g; rrect(x2 - ww / 2, wy, ww, 2.2 * k, 3); ctx.fill();
      ctx.fillStyle = "#1b1f24";
      for (const dx of [-0.3, 0.3]) { ctx.beginPath(); ctx.arc(x2 + dx * ww, yt - 0.5 * k, 0.8 * k, 0, 7); ctx.fill(); }
      // Stange
      g = ctx.createLinearGradient(0, yc - 0.4 * k, 0, yc + 0.4 * k); g.addColorStop(0, "#eef2f6"); g.addColorStop(1, "#6d7680");
      ctx.fillStyle = g; ctx.fillRect(x2, yc - Math.max(1.5, 0.35 * k), xs - x2, Math.max(3, 0.7 * k));
      // Sensorstativ
      metalV(xs + sw / 2 - sb / 2, yc, sb, yt - yc);
      g = ctx.createLinearGradient(0, yt - 2 * k, 0, yt); g.addColorStop(0, "#5d6670"); g.addColorStop(1, "#30363e");
      ctx.fillStyle = g; rrect(xs + sw / 2 - 7 * k, yt - 2 * k, 14 * k, 2 * k + 3, 3); ctx.fill();
      // Sensor
      g = ctx.createLinearGradient(0, yc - sh / 2, 0, yc + sh / 2); g.addColorStop(0, "#f05a4a"); g.addColorStop(0.5, "#c0392b"); g.addColorStop(1, "#7f2219");
      ctx.fillStyle = g; rrect(xs, yc - sh / 2, sw, sh, 4); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.35)"; rrect(xs + 3, yc - sh / 2 + 2, sw - 6, sh * 0.25, 3); ctx.fill();
      if (sw > 40) txt("Sensor", xs + sw / 2, yc + sh * 0.12, Math.min(fz * 0.75, sh * 0.42), "#fff", "center", true);
    } else {
      ctx.strokeStyle = "#1d2733"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x2, yc + r2); ctx.lineTo(x2, wy); ctx.stroke();
      ctx.strokeRect(x2 - ww / 2, wy, ww, 3 * k);
      ctx.beginPath(); ctx.moveTo(x2 + r2, yc); ctx.lineTo(xs, yc); ctx.moveTo(xs + sw / 2, yc + sh / 2); ctx.lineTo(xs + sw / 2, yt); ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.fillRect(xs, yc - sh / 2, sw, sh); ctx.strokeRect(xs, yc - sh / 2, sw, sh);
      if (sw > 40) txt("Sensor", xs + sw / 2, yc, Math.min(fz * 0.75, sh * 0.42), "#1d2733", "center", true);
    }
    S.sensor = { x:xs + sw / 2, y:yc - sh / 2 };

    // Kugeln aus Blei
    if (d3) { ball(x1, yc, r1, "#6c7480", "#d9dee4", "#2a2f36"); ball(x2, yc, r2, "#6c7480", "#d9dee4", "#2a2f36"); }
    else {
      ctx.lineWidth = 2; ctx.strokeStyle = "#1d2733"; ctx.fillStyle = "#e3e7ec";
      for (const [x, r] of [[x1, r1], [x2, r2]]) { ctx.beginPath(); ctx.arc(x, yc, r, 0, 7); ctx.fill(); ctx.stroke(); }
    }
  }

  function drawSpace(W, H, k, x1, x2, yc, r1, r2, d3, fz, ink, sub) {
    const R1 = Math.max(r1, 1.5), R2 = Math.max(r2, 1.2);
    if (d3) {
      // Planet
      ctx.save(); ctx.beginPath(); ctx.arc(x1, yc, R1, 0, 7); ctx.clip();
      let g = ctx.createRadialGradient(x1 - R1 * 0.35, yc - R1 * 0.4, R1 * 0.05, x1, yc, R1);
      g.addColorStop(0, "#9fd3ff"); g.addColorStop(0.5, "#2f78c4"); g.addColorStop(1, "#0c2547");
      ctx.fillStyle = g; ctx.fillRect(x1 - R1, yc - R1, 2 * R1, 2 * R1);
      if (R1 > 8) {
        ctx.fillStyle = "rgba(90,160,80,.75)";
        for (const [a, b, s] of [[-0.35, -0.2, 0.32], [0.25, 0.15, 0.28], [-0.05, 0.45, 0.2], [0.4, -0.45, 0.16]]) {
          ctx.beginPath(); ctx.ellipse(x1 + a * R1, yc + b * R1, s * R1 * 1.3, s * R1, 0.5, 0, 7); ctx.fill();
        }
        ctx.fillStyle = "rgba(255,255,255,.35)";
        ctx.beginPath(); ctx.ellipse(x1 - 0.1 * R1, yc - 0.65 * R1, 0.55 * R1, 0.08 * R1, -0.2, 0, 7); ctx.fill();
      }
      g = ctx.createRadialGradient(x1 + R1 * 0.5, yc + R1 * 0.4, R1 * 0.2, x1, yc, R1 * 1.05);
      g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.55)");
      ctx.fillStyle = g; ctx.fillRect(x1 - R1, yc - R1, 2 * R1, 2 * R1);
      ctx.restore();
      ctx.strokeStyle = "rgba(140,200,255,.45)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x1, yc, R1 + 1, 0, 7); ctx.stroke();
      // Mond
      ctx.save(); ctx.beginPath(); ctx.arc(x2, yc, R2, 0, 7); ctx.clip();
      ball(x2, yc, R2, "#9a9a96", "#efefea", "#3b3b39");
      if (R2 > 6) { ctx.fillStyle = "rgba(60,60,58,.35)";
        for (const [a, b, s] of [[-0.3, -0.2, 0.2], [0.25, 0.3, 0.15], [0.3, -0.35, 0.12], [-0.2, 0.4, 0.1]]) { ctx.beginPath(); ctx.arc(x2 + a * R2, yc + b * R2, s * R2, 0, 7); ctx.fill(); } }
      ctx.restore();
    } else {
      ctx.lineWidth = 2; ctx.strokeStyle = "#1d2733";
      ctx.fillStyle = "#d6e6f5"; ctx.beginPath(); ctx.arc(x1, yc, R1, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#e3e3e0"; ctx.beginPath(); ctx.arc(x2, yc, R2, 0, 7); ctx.fill(); ctx.stroke();
    }
    S.sensor = null;
  }

  // Messgerät mit großer Anzeige (nicht maßstäblich, damit gut ablesbar)
  function drawMeter(W, fz, F, lab, d3) {
    let shown = F;
    if (lab && $("cbNoise").checked) shown = F + S.noise * 0.3e-9;
    let big, unit, line2, ex = "";
    if (lab) {
      const n = shown * 1e9, a = Math.abs(n);
      big = de(n, a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : a >= 0.1 ? 3 : 4); unit = "nN";
      S.reading = big;
      const e = Math.floor(Math.log10(Math.abs(shown) || 1e-30));
      line2 = "= " + de(shown / Math.pow(10, e), 2) + " · 10" + sup(e) + " N";
    } else {
      const e = Math.floor(Math.log10(shown)), m = shown / Math.pow(10, e);
      big = de(m, 2) + "·10"; ex = String(e); unit = "N";
      const f = shown / 1e20, ef = Math.floor(Math.log10(f));       // in 10^20 N, 3 gültige Ziffern
      S.reading = de(f, Math.max(0, 2 - ef));
      line2 = "";
    }
    const bf = fz * 2.3, mono = "600 " + Math.round(bf) + "px Menlo, Consolas, 'Courier New', monospace";
    const exf = "600 " + Math.round(bf * 0.55) + "px Menlo, Consolas, 'Courier New', monospace";
    ctx.font = exf; const ew = ex ? ctx.measureText(ex).width + 2 : 0;
    ctx.font = mono; const bw = ctx.measureText(big).width + ew;
    ctx.font = "600 " + Math.round(fz * 1.2) + "px " + FONT; const uw = ctx.measureText(unit).width;
    const w = Math.max(fz * 15, bw + uw + fz * 2.6), h = fz * 6.2;
    // große Zahl, rechtsbündig bis xr, Zehnerexponent hochgestellt
    const bigText = (xr, ym) => {
      ctx.textBaseline = "middle"; ctx.textAlign = "right";
      if (ex) { ctx.font = exf; ctx.fillText(ex, xr, ym - bf * 0.32); }
      ctx.font = mono; ctx.fillText(big, xr - ew, ym);
    };
    let x = 12, y = 12;
    if (W - 12 - 250 < w + 24) y = 62;                // unter die Werkzeugleiste, wenn es oben zu eng ist
    S.meter = { x, y, w, h };
    const title = lab ? "Kraft auf m_2 (Kraftsensor)" : "Gravitationskraft F";
    if (d3) {
      // Kabel zum Sensor
      if (S.sensor) {
        ctx.strokeStyle = "#15181c"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x + w * 0.75, y + h); ctx.bezierCurveTo(x + w * 0.75, y + h + 80, S.sensor.x, S.sensor.y - 90, S.sensor.x, S.sensor.y); ctx.stroke();
      }
      ctx.fillStyle = "rgba(0,0,0,.35)"; rrect(x + 3, y + 5, w, h, 12); ctx.fill();
      let g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, "#4a525d"); g.addColorStop(1, "#1d2127");
      ctx.fillStyle = g; rrect(x, y, w, h, 12); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.lineWidth = 1; rrect(x + 0.5, y + 0.5, w - 1, h - 1, 12); ctx.stroke();
      txt(title, x + 12, y + fz * 0.9, fz * 0.85, "#dfe5ec", "left", true);
      const lx = x + 10, ly = y + fz * 1.7, lw = w - 20, lh = fz * 3.0;
      g = ctx.createLinearGradient(0, ly, 0, ly + lh); g.addColorStop(0, "#d5e6b9"); g.addColorStop(1, "#a7c286");
      ctx.fillStyle = g; rrect(lx, ly, lw, lh, 6); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.lineWidth = 2; rrect(lx, ly, lw, lh, 6); ctx.stroke();
      ctx.fillStyle = "#1f2a14"; bigText(lx + lw - uw - fz * 0.9, ly + lh / 2 + 1);
      ctx.font = "600 " + Math.round(fz * 1.2) + "px " + FONT; ctx.textAlign = "left";
      ctx.fillText(unit, lx + lw - uw - fz * 0.5, ly + lh / 2 + 2);
      txt(line2, x + w - 12, y + h - fz * 0.75, fz * 0.85, "#c9d2dc", "right");
    } else {
      if (S.sensor) {
        ctx.strokeStyle = "#5b6675"; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.moveTo(x + w * 0.75, y + h); ctx.bezierCurveTo(x + w * 0.75, y + h + 80, S.sensor.x, S.sensor.y - 90, S.sensor.x, S.sensor.y); ctx.stroke(); ctx.setLineDash([]);
      }
      ctx.fillStyle = "#fff"; rrect(x, y, w, h, 8); ctx.fill();
      ctx.strokeStyle = "#1d2733"; ctx.lineWidth = 2; rrect(x, y, w, h, 8); ctx.stroke();
      txt(title, x + 12, y + fz * 0.9, fz * 0.85, "#5b6675", "left", true);
      const ly = y + fz * 1.7, lh = fz * 3.0;
      ctx.fillStyle = "#1d2733"; bigText(x + w - 10 - uw - fz * 0.9, ly + lh / 2 + 1);
      ctx.font = "600 " + Math.round(fz * 1.2) + "px " + FONT; ctx.textAlign = "left";
      ctx.fillText(unit, x + w - 10 - uw - fz * 0.5, ly + lh / 2 + 2);
      txt(line2, x + w - 12, y + h - fz * 0.75, fz * 0.85, "#5b6675", "right");
    }
  }

  // ---------- Bedienung ----------
  const pars = [...document.querySelectorAll(".par")];
  function syncInputs() {
    const c = C(), p = P();
    for (const el of pars) {
      const key = el.dataset.k, d = c.par[key], inp = el.querySelector("input");
      inp.min = d.min; inp.max = d.max; inp.step = d.step; inp.value = p[key];
      el.querySelector("output").textContent = c.txt[key](p[key]);
    }
  }
  function setPar(key, v) {
    const d = C().par[key];
    v = Math.round(v / d.step) * d.step;
    P()[key] = Math.max(d.min, Math.min(d.max, v));
    syncInputs(); draw();
  }
  for (const el of pars) {
    const key = el.dataset.k, inp = el.querySelector("input");
    inp.addEventListener("input", () => setPar(key, +inp.value));
    el.querySelector(".minus").onclick = () => setPar(key, P()[key] - C().par[key].step);
    el.querySelector(".plus").onclick = () => setPar(key, P()[key] + C().par[key].step);
  }
  function fillScales() {
    const c = C(), sel = $("arrowScale");
    sel.innerHTML = c.scales.map((s, i) => "<option value='" + i + "'>" + s.t + "</option>").join("");
    sel.value = S.scale[S.scene];
  }
  $("arrowScale").addEventListener("change", () => { S.scale[S.scene] = +$("arrowScale").value; draw(); });

  const EXPL = {
    lab: "<b>Forschungsauftrag:</b> Wovon hängt die Anziehungskraft F zwischen den beiden Bleikugeln ab? " +
         "Verändere immer nur <b>eine</b> Größe (m<sub>1</sub>, m<sub>2</sub> oder r), lies die Kraft am Messgerät ab und notiere sie mit „Messwert notieren“.",
    space: "<b>Forschungsauftrag:</b> Gilt bei Himmelskörpern derselbe Zusammenhang wie im Labor? " +
           "Miss wieder, indem du immer nur eine Größe veränderst. Vergleiche die Größenordnungen mit dem Labor."
  };
  const SIMPL = {
    lab: "Du kannst die rechte Kugel auch mit dem Finger verschieben. Vereinfachungen: Kugeln aus Blei (11,3 g/cm³), ihre Größe ergibt sich aus der Masse. " +
         "Der Sensor misst nur die Anziehung zwischen den beiden Kugeln. In Wirklichkeit stören Luftzug, Erschütterungen und die Anziehung durch Tisch, Stative und Personen; " +
         "so kleine Kräfte misst man deshalb mit einer Drehwaage (Cavendish, 1798). Messrauschen: ±0,3 nN wie bei einem sehr guten Sensor.",
    space: "Du kannst den rechten Körper auch mit dem Finger verschieben. Vereinfachungen: Die Körper werden festgehalten gedacht (in Wirklichkeit würden sie sich bewegen). " +
           "Größe aus der Masse mit typischer Dichte (Planet 5,5 g/cm³, Mond 3,3 g/cm³). Erde und Mond gerundet: m<sub>Erde</sub> ≈ 5,97 · 10²⁴ kg, m<sub>Mond</sub> ≈ 7,35 · 10²² kg, mittlerer Abstand ≈ 384 400 km."
  };
  // Messwerte notieren: nur eine Liste der abgelesenen Werte, keine Auswertung
  const NOTES = { lab:[], space:[] };
  const HEAD = {
    lab: "<th>Nr.</th><th>m<sub>1</sub> in kg</th><th>m<sub>2</sub> in kg</th><th>r in cm</th><th>F in nN</th>",
    space: "<th>Nr.</th><th>m<sub>1</sub> in 10<sup>24</sup> kg</th><th>m<sub>2</sub> in 10<sup>22</sup> kg</th><th>r in 1000 km</th><th>F in 10<sup>20</sup> N</th>"
  };
  function showNotes() {
    const n = NOTES[S.scene];
    $("notes").innerHTML = n.length
      ? "<table><tr>" + HEAD[S.scene] + "</tr>" + n.map((q, i) => "<tr><td>" + (i + 1) + "</td><td>" + q.join("</td><td>") + "</td></tr>").join("") + "</table>"
      : "<div class='empty'>Noch keine Messwerte notiert.</div>";
    $("noteUndo").disabled = $("noteClear").disabled = !n.length;
  }
  $("noteBtn").onclick = () => {
    const p = P();
    NOTES[S.scene].push([String(p.m1), String(p.m2), S.scene === "lab" ? String(p.r) : String(p.r / 1000), S.reading]);
    showNotes();
    const t = $("notes").querySelector("tr:last-child"); if (t && t.scrollIntoView) t.scrollIntoView({ block:"nearest" });
  };
  $("noteUndo").onclick = () => { NOTES[S.scene].pop(); showNotes(); };
  $("noteClear").onclick = () => { if (confirm("Alle notierten Messwerte löschen?")) { NOTES[S.scene].length = 0; showNotes(); } };

  function setScene(s) {
    S.scene = s;
    $("tabLab").classList.toggle("on", s === "lab"); $("tabSpace").classList.toggle("on", s === "space");
    document.querySelectorAll(".lab").forEach(e => e.classList.toggle("hidden", s !== "lab"));
    document.querySelectorAll(".space").forEach(e => e.classList.toggle("hidden", s !== "space"));
    $("expl").innerHTML = EXPL[s]; $("simpl").innerHTML = SIMPL[s];
    fillScales(); syncInputs(); noiseTimer(); draw(); showNotes();
  }
  function setFs(v) {
    S.fs = Math.max(0.8, Math.min(1.6, Math.round(v * 10) / 10));
    document.documentElement.style.fontSize = (14 * S.fs) + "px";
    store.set("gravi_fs", S.fs); resize();
  }
  function setView(v) {
    S.view = v; $("view").textContent = v === "3d" ? "Symbol" : "3D";
    $("view").title = v === "3d" ? "Zur Symbolansicht wechseln" : "Zur 3D-Ansicht wechseln";
    store.set("gravi_view", v); draw();
  }
  // Messrauschen: alle 0,4 s ein neuer Messwert (normalverteilt)
  let timer = null;
  function noiseTimer() {
    const on = S.scene === "lab" && $("cbNoise").checked;
    if (on && !timer) timer = setInterval(() => {
      const u = 1 - Math.random(), v = Math.random();
      S.noise = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); draw();
    }, 400);
    if (!on && timer) { clearInterval(timer); timer = null; S.noise = 0; }
  }

  $("fsMinus").onclick = () => setFs(S.fs - 0.1);
  $("fsPlus").onclick = () => setFs(S.fs + 0.1);
  $("view").onclick = () => setView(S.view === "3d" ? "sym" : "3d");
  $("panelBtn").onclick = () => { document.body.classList.toggle("nopanel"); resize(); };
  const docEl = document.documentElement, reqFS = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
  if (!reqFS) $("full").classList.add("hidden");
  $("full").onclick = () => {
    const cur = document.fullscreenElement || document.webkitFullscreenElement;
    if (cur) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else reqFS.call(docEl);
  };
  $("rotGo").onclick = () => document.body.classList.add("quer");
  $("tabLab").onclick = () => setScene("lab");
  $("tabSpace").onclick = () => setScene("space");
  $("cbArrow").addEventListener("change", () => { document.querySelector(".arrowrow").classList.toggle("hidden", !$("cbArrow").checked); draw(); });
  $("cbNoise").addEventListener("change", () => { noiseTimer(); draw(); });
  $("cbMag").addEventListener("change", draw);
  $("preset").onclick = () => { Object.assign(S.val.space, { m1:6, m2:7, r:380000 }); syncInputs(); draw(); };
  $("reset").onclick = () => {
    const c = C(); for (const k in c.par) P()[k] = c.par[k].def;
    S.scale[S.scene] = c.defScale; fillScales();
    $("cbArrow").checked = true; document.querySelector(".arrowrow").classList.remove("hidden");
    $("cbNoise").checked = false; $("cbMag").checked = true; noiseTimer();
    syncInputs(); draw();
  };

  // Rechten Körper mit dem Finger verschieben
  function px(ev) { const r = cv.getBoundingClientRect(); return { x:ev.clientX - r.left, y:ev.clientY - r.top }; }
  cv.addEventListener("pointerdown", ev => {
    const q = px(ev), x2 = S.x1 + P().r * S.k, R2 = Math.max(radii()[1] * S.k, 22);
    if (Math.abs(q.x - x2) < R2 + 6 && Math.abs(q.y - S.yc) < R2 + 16) { S.drag = true; S.dx = q.x - x2; cv.setPointerCapture(ev.pointerId); ev.preventDefault(); }
  });
  cv.addEventListener("pointermove", ev => {
    if (!S.drag) return;
    const q = px(ev); setPar("r", (q.x - S.dx - S.x1) / S.k);
  });
  const up = () => { S.drag = false; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);

  window.addEventListener("resize", resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
  S.view = store.get("gravi_view") === "sym" ? "sym" : "3d"; $("view").textContent = S.view === "3d" ? "Symbol" : "3D";
  setScene("lab");
  setFs(+store.get("gravi_fs") || 1);
})();
</script>
</body>
</html>
