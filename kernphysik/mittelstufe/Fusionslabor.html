<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fusionslabor</title>
<style>
:root{
  --fs:1.25; --pz:1;
  --bg:#0d1526; --bg2:#16213a; --panel:#f4f6fa; --ink:#1b2333; --muted:#5b6475; --line:#d5dbe5;
  --accent:#2563eb; --accent2:#1d4ed8; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --p:#d9342b; --n:#8f9aa8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:10px;padding:6px 10px;background:linear-gradient(#1c2a48,#121c33);border-bottom:1px solid #000;flex:0 0 auto}
header h1{margin:0 6px 0 2px;font-size:19px;color:#fff;font-weight:700;letter-spacing:.3px;white-space:nowrap}
#tabs{display:flex;flex-wrap:wrap;gap:4px}
#tabs::-webkit-scrollbar{display:none}
#tabs button{border:0;border-radius:9px;padding:8px 10px;font-size:14.5px;font-weight:600;color:#c8d3ea;background:rgba(255,255,255,.07);cursor:pointer;white-space:nowrap}
#tools{margin-left:auto;display:flex;gap:4px;flex:0 0 auto}
#tools button{border:0;border-radius:9px;min-width:40px;padding:8px 9px;font-size:16px;font-weight:700;color:#c8d3ea;background:rgba(255,255,255,.07);cursor:pointer}
#tools button.on{background:#fff;color:#14203a}
main.nopanel aside{display:none}
#tools button:disabled{opacity:.35;cursor:default}
#tabs button.on{background:#fff;color:#14203a;box-shadow:0 2px 6px rgba(0,0,0,.35)}
main{flex:1 1 auto;display:flex;min-height:0}
#stage{position:relative;flex:1 1 auto;min-width:0;background:radial-gradient(ellipse at 40% 35%,#1d2c4d 0%,#0d1526 70%)}
#cv{position:absolute;left:0;top:0;touch-action:none}
#eq{position:absolute;left:0;right:0;top:10px;text-align:center;color:#fff;font-size:calc(24px*var(--fs));pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#eq .small{font-size:calc(14px*var(--fs));color:#c8d3ea;display:block;margin-top:4px}
#hint{position:absolute;left:12px;bottom:10px;color:#9fb0d0;font-size:calc(11.5px*var(--fs));pointer-events:none;max-width:70%}
aside{flex:0 0 300px;zoom:var(--pz);background:var(--panel);overflow-y:auto;padding:12px 12px 20px;border-left:1px solid #000;-webkit-overflow-scrolling:touch}
aside h2{font-size:18px;margin:2px 0 8px}
aside h3{font-size:14px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:11px 10px;margin:6px 0;font-size:16px;font-weight:600;cursor:pointer;
  background:linear-gradient(#fff,#e9edf4);color:var(--ink);box-shadow:0 1px 0 #fff inset,0 1px 3px rgba(0,0,0,.25);border:1px solid #c3cad6}
.btn:active{transform:translateY(1px)}
.btn.main{background:linear-gradient(#3b82f6,#1d4ed8);color:#fff;border-color:#1e40af;box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 2px 5px rgba(0,0,0,.3)}
.btn.red{background:linear-gradient(#ef4444,#b91c1c);color:#fff;border-color:#991b1b}
.btn:disabled{opacity:.45}
.row{display:flex;gap:6px}
.row .btn{flex:1}
.btn.sm{padding:8px 6px;font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.seg button{flex:1 1 auto;border:1px solid #c3cad6;background:#fff;border-radius:8px;padding:8px 6px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent2)}
label.sw{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:15px;cursor:pointer}
label.sw input{display:none}
label.sw .t{width:44px;height:26px;border-radius:13px;background:#c3cad6;position:relative;flex:0 0 auto;transition:.15s}
label.sw .t:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.15s}
label.sw input:checked+.t{background:var(--accent)}
label.sw input:checked+.t:after{left:21px}
.sl{margin:8px 0}
.sl .lab{display:flex;justify-content:space-between;font-size:15px;margin-bottom:2px}
.sl .lab b{font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:30px;accent-color:var(--accent)}
.info{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;line-height:1.4;margin:8px 0}
.info.big{font-size:17px}
details{background:#fff;border:1px solid var(--line);border-radius:10px;margin:8px 0;font-size:14.5px;line-height:1.45}
details summary{padding:9px 10px;font-weight:700;cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:before{content:"▸ ";color:var(--accent)}
details[open] summary:before{content:"▾ "}
details div{padding:0 10px 10px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-weight:700;font-size:15px;color:#fff}
.b-ok{background:var(--ok)}.b-warn{background:var(--warn)}.b-bad{background:var(--bad)}.b-blue{background:#2563eb}.b-grey{background:#6b7280}
.nuc{display:inline-flex;align-items:center;white-space:nowrap}
.nuc .az{display:inline-flex;flex-direction:column;font-size:.58em;line-height:1.02;text-align:right;margin-right:.08em}
.ov{text-decoration:overline}
.list .btn{text-align:left;font-size:15px;padding:9px 10px;margin:4px 0}
.list.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.list.grid2 .btn{margin:0;font-size:13.5px;padding:8px 7px;line-height:1.25}
.list .btn.on{background:linear-gradient(#dbe7ff,#c7d8fb);border-color:#7da2ef}
table.res{width:100%;border-collapse:collapse;font-size:13.5px}
table.res td,table.res th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left}
.kpi{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:14px;margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:13px;height:13px;border-radius:50%;display:inline-block;box-shadow:inset -2px -2px 3px rgba(0,0,0,.35)}
@media (max-width:1100px){header h1{font-size:0}header h1:first-letter{font-size:20px}header{gap:6px;padding:6px 6px}#tabs button{padding:8px 8px;font-size:13.5px}#tools button{min-width:34px;padding:7px 6px}}
@media (max-width:900px){aside{flex-basis:260px}header h1{font-size:16px}#tabs button{padding:8px 9px;font-size:14px}#eq{font-size:calc(20px*var(--fs))}}
@media (orientation:portrait) and (min-width:641px){
  main{flex-direction:column}
  #stage{flex:1 1 auto;min-height:0}
  aside{flex:0 0 auto;height:40%;border-left:0;border-top:1px solid #000;padding:10px 14px 20px}
  #hint{max-width:92%}
}
@media (orientation:landscape) and (max-height:500px){body:not(.quer) #rot2{display:flex!important}}
#rot2{display:none;position:fixed;inset:0;background:rgba(13,21,38,.96);color:#fff;z-index:9;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-size:20px;text-align:center;padding:24px}
#rot2 button{border:0;border-radius:10px;padding:10px 16px;font-size:16px;font-weight:700;background:#fff;color:#14203a}
@media (max-width:640px) and (orientation:portrait){
  header{padding:5px 6px;gap:6px}
  header h1{display:none}
  #tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-width:0;scrollbar-width:none}
  #tabs button{padding:7px 9px;font-size:13.5px}
  #ttl{font-size:16px;flex:1 1 auto}
  #tools{gap:3px}#tools button{min-width:32px;padding:6px 5px;font-size:14px}
  #t_panel{display:none}
  main{flex-direction:column}
  #stage{flex:0 0 auto;height:60vh;height:60svh}
  main.nopanel aside{display:block}
  aside{flex:1 1 auto;border-left:0;border-top:1px solid #000;padding:8px 10px 24px}
  #eq{font-size:calc(27px*var(--fs));top:6px}#eq .small{font-size:calc(17px*var(--fs))}
  #hint{display:none}
  .list.grid2 .btn{font-size:13px}
}
#cmp{position:absolute;left:10px;right:10px;bottom:10px;overflow:auto;-webkit-overflow-scrolling:touch}
#cmp table{width:100%;border-collapse:separate;border-spacing:0 4px;color:#e6ecf7;font-size:calc(11.5px*var(--fs));line-height:1.3}
#cmp th{font-size:calc(13px*var(--fs));text-align:left;padding:2px 8px}#cmp th.cs{color:#ffb27a}#cmp th.cf{color:#8fe0b0}
#cmp td{background:rgba(255,255,255,.06);padding:5px 8px;vertical-align:top;cursor:pointer}
#cmp td:first-child{font-weight:700;color:#c8d3ea;border-radius:8px 0 0 8px;width:22%}#cmp td:last-child{border-radius:0 8px 8px 0}
#cmp tr.on td{background:rgba(255,214,102,.2);color:#fff}
@media (max-width:640px) and (orientation:portrait){#cmp{left:4px;right:4px;bottom:4px}#cmp td{padding:4px 5px}}

.ico{width:1.25em;height:1.25em;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block}
</style>
</head>
<body>
<div id="app">
  <header><h1>☀︎ Fusionslabor</h1><nav id="tabs"></nav><div id="tools"><button id="t_fsm" title="Schrift kleiner">A−</button><button id="t_fsp" title="Schrift größer">A+</button><button id="t_view" title="3D-Ansicht / Symbolansicht">3D</button><button id="t_full" title="Vollbild"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><button id="t_panel" title="Bedienfeld ein-/ausblenden"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button></div></header>
  <main>
    <div id="stage"><canvas id="cv"></canvas><div id="eq"></div><div id="hint"></div></div>
    <aside id="panel"></aside>
  </main>
</div>
<div id="rot2"><div>Auf dem Handy bitte hochkant halten.</div><button onclick="document.body.classList.add('quer')">Trotzdem quer weiter</button></div>
<script>
"use strict";
/* ===================== Grundlagen ===================== */
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, FS = 1.25, FLAT = false;
const PORT = () => H > W*1.02;
const PHONE = () => window.matchMedia('(max-width:640px) and (orientation:portrait)').matches;  // FS: Schriftfaktor für die Anzeige am Fernseher
const TAU = Math.PI * 2;
const rnd = Math.random;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = (v, d = 1) => v.toLocaleString('de-DE', {minimumFractionDigits: d, maximumFractionDigits: d});
const fmtInt = v => Math.round(v).toLocaleString('de-DE');

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const SYM=['n','H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar','K','Ca','Sc','Ti','V','Cr','Mn','Fe','Co','Ni','Cu','Zn','Ga','Ge','As','Se','Br','Kr','Rb','Sr','Y','Zr','Nb','Mo','Tc','Ru','Rh','Pd','Ag','Cd','In','Sn','Sb','Te','I','Xe','Cs','Ba','La','Ce','Pr','Nd','Pm','Sm','Eu','Gd','Tb','Dy','Ho','Er','Tm','Yb','Lu','Hf','Ta','W','Re','Os','Ir','Pt','Au','Hg','Tl','Pb','Bi','Po','At','Rn','Fr','Ra','Ac','Th','Pa','U','Np','Pu','Am'];
const NAME={0:'Neutron',1:'Wasserstoff',2:'Helium',3:'Lithium',4:'Beryllium',5:'Bor',6:'Kohlenstoff',7:'Stickstoff',8:'Sauerstoff',9:'Fluor',10:'Neon',11:'Natrium',12:'Magnesium',13:'Aluminium',14:'Silicium',15:'Phosphor',16:'Schwefel',17:'Chlor',18:'Argon',19:'Kalium',20:'Calcium',21:'Scandium',27:'Cobalt',28:'Nickel',36:'Krypton',37:'Rubidium',38:'Strontium',39:'Yttrium',40:'Zirconium',52:'Tellur',54:'Xenon',55:'Caesium',56:'Barium',81:'Thallium',82:'Blei',83:'Bismut',84:'Polonium',86:'Radon',88:'Radium',90:'Thorium',91:'Protactinium',92:'Uran',93:'Neptunium',95:'Americium'};

/* Nuklid-Schreibweise in HTML: Massenzahl oben, Ordnungszahl unten */
function nucHTML(A, Z, sym, star){return `<span class="nuc"><span class="az"><span>${A}</span><span>${Z}</span></span>${sym}${star?'<sup>*</sup>':''}</span>`;}
const H_ALPHA = () => nucHTML(4, 2, 'He');
const H_EM = () => nucHTML(0, '−1', 'e');
const H_EP = () => nucHTML(0, '+1', 'e');
const H_NU = '&nu;<sub>e</sub>';
const H_NUBAR = '<span class="ov">&nu;</span><sub>e</sub>';
const H_N = () => nucHTML(1, 0, 'n');

/* ---------- Farben und 3D-Kugeln (vorberechnete Sprites) ---------- */
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function shade(h, f){const c=hex2rgb(h);return 'rgb('+c.map(v=>Math.round(f>0?v+(255-v)*f:v*(1+f))).join(',')+')';}
const COL={p:'#d9342b', n:'#a3adb9', e:'#2f80ed', pos:'#f08a24', gamma:'#b277ff', nu:'#7ee0c3', u235:'#f5b301', u238:'#6f8193'};
const spriteCache = new Map();
function ballSprite(col, r){
  r = Math.max(0.75, Math.round(r*4)/4);
  const key = col+'|'+r+'|'+DPR;
  let c = spriteCache.get(key); if (c) return c;
  const size = Math.ceil(r*2+4);
  c = document.createElement('canvas'); c.width = c.height = Math.ceil(size*DPR);
  const g = c.getContext('2d'); g.scale(DPR, DPR);
  const m = size/2;
  const gr = g.createRadialGradient(m-r*.38, m-r*.42, r*.08, m, m, r);
  gr.addColorStop(0, shade(col, .75)); gr.addColorStop(.25, shade(col, .2));
  gr.addColorStop(.75, col); gr.addColorStop(1, shade(col, -.55));
  g.fillStyle = gr; g.beginPath(); g.arc(m, m, r, 0, TAU); g.fill();
  c._s = size; spriteCache.set(key, c); return c;
}
function ball(x, y, r, col, a){
  if (FLAT){ // Symbolansicht: flache Kreise mit Rand
    ctx.globalAlpha = a === undefined ? 1 : Math.max(0, a); ctx.fillStyle = col; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = Math.max(1, r*0.12);
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.stroke(); ctx.globalAlpha = 1; return;
  }
  const s = ballSprite(col, r);
  if (a !== undefined && a < 1){ctx.globalAlpha = Math.max(0, a);}
  ctx.drawImage(s, x - s._s/2, y - s._s/2, s._s, s._s);
  ctx.globalAlpha = 1;
}
function glow(x, y, r, col, a){
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = a === undefined ? 1 : a; ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
}
function rrect(x, y, w, h, r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* Text mit echtem Hoch-/Tiefstellen im Canvas */
function symText(base, sub, sup, x, y, size, col, align, bar){
  size *= FS;
  ctx.save(); ctx.fillStyle = col || '#fff'; ctx.textBaseline = 'alphabetic';
  ctx.font = `600 ${size}px -apple-system,Segoe UI,Roboto,Arial`;
  const wb = ctx.measureText(base).width;
  ctx.font = `600 ${size*.62}px -apple-system,Segoe UI,Roboto,Arial`;
  const ws = Math.max(sub?ctx.measureText(sub).width:0, sup?ctx.measureText(sup).width:0);
  const tot = wb + ws + 1;
  let x0 = align === 'center' ? x - tot/2 : align === 'right' ? x - tot : x;
  ctx.font = `600 ${size}px -apple-system,Segoe UI,Roboto,Arial`;
  ctx.fillText(base, x0, y);
  if (bar){ctx.fillRect(x0+wb*.12, y-size*.86, wb*.8, Math.max(1.5,size*.07));}
  ctx.font = `600 ${size*.62}px -apple-system,Segoe UI,Roboto,Arial`;
  if (sup) ctx.fillText(sup, x0+wb+1, y-size*.42);
  if (sub) ctx.fillText(sub, x0+wb+1, y+size*.22);
  ctx.restore();
}
/* Nuklid im Canvas: A oben links, Z unten links */
function nucText(A, Z, sym, x, y, size, col, align){
  size *= FS;
  ctx.save(); ctx.fillStyle = col || '#fff';
  ctx.font = `600 ${size*.6}px -apple-system,Segoe UI,Roboto,Arial`;
  const wa = Math.max(ctx.measureText(String(A)).width, ctx.measureText(String(Z)).width);
  ctx.font = `700 ${size}px -apple-system,Segoe UI,Roboto,Arial`;
  const ws = ctx.measureText(sym).width; const tot = wa + 2 + ws;
  let x0 = align === 'center' ? x - tot/2 : align === 'right' ? x - tot : x;
  ctx.textAlign = 'right'; ctx.font = `600 ${size*.6}px -apple-system,Segoe UI,Roboto,Arial`;
  ctx.fillText(String(A), x0+wa, y - size*.42); ctx.fillText(String(Z), x0+wa, y + size*.18);
  ctx.textAlign = 'left'; ctx.font = `700 ${size}px -apple-system,Segoe UI,Roboto,Arial`;
  ctx.fillText(sym, x0+wa+2, y);
  ctx.restore();
}
function label(t, x, y, size, col, align, weight){
  size *= FS; if (W < 500) size = Math.max(size, 11); // Handy: Beschriftungen nicht unter 11 px
  ctx.save(); ctx.fillStyle = col || '#fff'; ctx.font = `${weight||600} ${size}px -apple-system,Segoe UI,Roboto,Arial`;
  // Text, der über den Rand ragen würde, wird kleiner gesetzt (wichtig bei großer Schrift)
  const room = align === 'right' ? x - 4 : align === 'center' ? 2*Math.min(x, W - x) - 8 : W - x - 4, tw = ctx.measureText(t).width;
  if (room > 30 && tw > room) ctx.font = `${weight||600} ${size*Math.max(0.55, room/tw)}px -apple-system,Segoe UI,Roboto,Arial`;
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y, room > 30 ? room : undefined); ctx.restore();
}

/* ---------- Kugelpackung für Atomkerne ---------- */
const packCache = {};
function pack(A){
  if (A <= 0) return [];
  if (packCache[A]) return packCache[A];
  const r = mulberry(A*9301 + 49297);
  const R = 0.95*Math.cbrt(A) + 0.3;
  const P = [];
  while (P.length < A){const x=(r()*2-1)*R,y=(r()*2-1)*R,z=(r()*2-1)*R; if (x*x+y*y+z*z <= R*R) P.push([x,y,z]);}
  if (A === 1) P[0] = [0,0,0];
  const D = 1.78;
  for (let it = 0; it < 90; it++){
    for (let i = 0; i < A; i++){const a = P[i];
      for (let j = i+1; j < A; j++){const b = P[j];
        let dx=b[0]-a[0], dy=b[1]-a[1], dz=b[2]-a[2]; let d2 = dx*dx+dy*dy+dz*dz;
        if (d2 < D*D){let d = Math.sqrt(d2)||0.01; const f = (D-d)/d*0.5;
          dx*=f; dy*=f; dz*=f; a[0]-=dx; a[1]-=dy; a[2]-=dz; b[0]+=dx; b[1]+=dy; b[2]+=dz;}
      }}
    for (const p of P){p[0]*=0.975; p[1]*=0.975; p[2]*=0.975;}
  }
  let cx=0,cy=0,cz=0; for (const p of P){cx+=p[0];cy+=p[1];cz+=p[2];} cx/=A;cy/=A;cz/=A;
  for (const p of P){p[0]-=cx;p[1]-=cy;p[2]-=cz;}
  packCache[A] = P; return P;
}
function packRadius(A){if (A<=1) return 1; const P = pack(A); let m = 0; for (const p of P) m = Math.max(m, Math.hypot(p[0],p[1],p[2])); return m + 1;}

/* ---------- Atomkern als 3D-Kugelhaufen ---------- */
class Nucleus{
  constructor(Z, N, seed){this.rot = 0; this.tilt = 0.35; this.excite = 0; this.deform = 0; this.spin = 0.25; this.list = []; this.set(Z, N, seed);}
  get Z(){return this.list.filter(q => q.t === 'p').length;}
  get N(){return this.list.filter(q => q.t === 'n').length;}
  get A(){return this.list.length;}
  set(Z, N, seed){
    const A = Z + N, P = pack(A), r = mulberry((seed||1)*131 + A*7 + Z);
    const types = []; for (let i = 0; i < Z; i++) types.push('p'); for (let i = 0; i < N; i++) types.push('n');
    for (let i = types.length-1; i > 0; i--){const j = Math.floor(r()*(i+1)); [types[i], types[j]] = [types[j], types[i]];}
    this.list = P.map((p, i) => ({x:p[0], y:p[1], z:p[2], tx:p[0], ty:p[1], tz:p[2], t:types[i], fl:0}));
  }
  retarget(){
    const P = pack(this.list.length), used = new Array(P.length).fill(false);
    const order = this.list.slice().sort((a, b) => (b.x*b.x+b.y*b.y+b.z*b.z) - (a.x*a.x+a.y*a.y+a.z*a.z));
    for (const q of order){let best = -1, bd = 1e9;
      for (let i = 0; i < P.length; i++){if (used[i]) continue; const d = (P[i][0]-q.x)**2+(P[i][1]-q.y)**2+(P[i][2]-q.z)**2; if (d < bd){bd = d; best = i;}}
      used[best] = true; q.tx = P[best][0]; q.ty = P[best][1]; q.tz = P[best][2];}
  }
  add(t){
    const a = rnd()*TAU, R = packRadius(this.A) + 6;
    this.list.push({x:Math.cos(a)*R, y:Math.sin(a)*R*0.6, z:4, tx:0, ty:0, tz:0, t, fl:0.8});
    this.retarget();
  }
  removeType(t){ // entfernt das außen am weitesten links/rechts liegende Teilchen
    let best = -1, bd = -1;
    this.list.forEach((q, i) => {if (q.t !== t) return; const d = q.x*q.x+q.y*q.y+q.z*q.z; if (d > bd){bd = d; best = i;}});
    if (best >= 0){this.list.splice(best, 1); this.retarget();}
  }
  /* Blickrichtung: gedrehte Koordinaten */
  view(q){
    const c = Math.cos(this.rot), s = Math.sin(this.rot);
    let x = q.x*c - q.z*s, z = q.x*s + q.z*c, y = q.y;
    const ct = Math.cos(this.tilt), st = Math.sin(this.tilt);
    const y2 = y*ct - z*st, z2 = y*st + z*ct;
    if (this.deform){const f = 1 + this.deform; x *= f; const g = 1/Math.sqrt(f); return [x, y2*g, z2*g];}
    return [x, y2, z2];
  }
  /* Indizes der am weitesten in Richtung (dx,dy) liegenden Nukleonen eines Typs */
  pick(t, n, dx, dy){
    const arr = [];
    this.list.forEach((q, i) => {if (q.t !== t) return; const v = this.view(q); arr.push([v[0]*dx + v[1]*dy + v[2]*0.3, i]);});
    arr.sort((a, b) => b[0] - a[0]);
    return arr.slice(0, n).map(a => a[1]);
  }
  update(dt){
    this.rot += dt*this.spin;
    const k = 1 - Math.pow(0.02, dt);
    for (const q of this.list){q.x += (q.tx-q.x)*k; q.y += (q.ty-q.y)*k; q.z += (q.tz-q.z)*k; if (q.fl > 0) q.fl = Math.max(0, q.fl - dt);}
    if (this.excite > 0 && this.exciteDecay) this.excite = Math.max(0, this.excite - dt*this.exciteDecay);
  }
  screen(q, cx, cy, s){
    const v = this.view(q); const f = 60/(60 - v[2]);
    let jx = 0, jy = 0; if (this.excite > 0){jx = (rnd()-.5)*this.excite*0.5; jy = (rnd()-.5)*this.excite*0.5;}
    return [cx + (v[0]+jx)*s*f, cy + (v[1]+jy)*s*f, v[2], f];
  }
  draw(cx, cy, s, alpha){
    if (!this.list.length) return;
    if (this.excite > 0){glow(cx, cy, (packRadius(this.A)+3)*s*(1+this.deform*0.5), 'rgba(255,220,120,0.55)', Math.min(1, this.excite));}
    const pts = this.list.map(q => {const v = this.screen(q, cx, cy, s); return [v[0], v[1], v[2], v[3], q];});
    pts.sort((a, b) => a[2] - b[2]);
    for (const p of pts){
      const q = p[4]; ball(p[0], p[1], s*1.0*p[3], q.t === 'p' ? COL.p : COL.n, alpha);
      if (q.fl > 0){ctx.strokeStyle = `rgba(255,255,255,${q.fl})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p[0], p[1], s*1.5*p[3]+ (1-q.fl)*s*2, 0, TAU); ctx.stroke();}
    }
  }
}

/* ---------- Teilchen, die aus dem Kern fliegen ---------- */
class Emitted{
  constructor(kind, x, y, vx, vy, s){this.kind = kind; this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.s = s; this.age = 0; this.alive = true; this.ph = rnd()*TAU;}
  update(dt){this.x += this.vx*dt; this.y += this.vy*dt; this.age += dt;
    if (this.x < -80 || this.x > W+80 || this.y < -80 || this.y > H+80) this.alive = false;
    if (this.life && this.age > this.life) this.alive = false;}
  draw(){
    const s = this.s, k = this.kind;
    if (k === 'alpha'){
      const P = pack(4), a = this.age*3;
      const pts = P.map((p, i) => {const c = Math.cos(a), sn = Math.sin(a); return [p[0]*c - p[2]*sn, p[1], p[0]*sn + p[2]*c, i < 2 ? COL.p : COL.n];}).sort((u, v) => u[2]-v[2]);
      for (const p of pts) ball(this.x + p[0]*s, this.y + p[1]*s, s, p[3]);
      symText('α', '', '', this.x, this.y - s*3.2, 26, '#ffe08a', 'center');
    } else if (k === 'e-' || k === 'e+'){
      ball(this.x, this.y, Math.max(5, s*0.55), k === 'e-' ? COL.e : COL.pos);
      symText('e', '', k === 'e-' ? '−' : '+', this.x, this.y - 18, 24, k === 'e-' ? '#9cc4ff' : '#ffc58a', 'center');
    } else if (k === 'nu' || k === 'nubar'){
      ctx.save(); ctx.strokeStyle = COL.nu; ctx.globalAlpha = 0.8; ctx.setLineDash([3,3]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(this.x, this.y, 6, 0, TAU); ctx.stroke(); ctx.restore();
      symText('ν', 'e', '', this.x, this.y - 13, 22, COL.nu, 'center', k === 'nubar');
    } else if (k === 'gamma'){
      const len = 70, ang = Math.atan2(this.vy, this.vx);
      ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(ang);
      ctx.strokeStyle = COL.gamma; ctx.lineWidth = 3; ctx.shadowColor = COL.gamma; ctx.shadowBlur = 10; ctx.beginPath();
      for (let i = 0; i <= 40; i++){const u = -len + i/40*len; const env = Math.sin(i/40*Math.PI); const yy = Math.sin(u*0.45 + this.ph)*7*env; i ? ctx.lineTo(u, yy) : ctx.moveTo(u, yy);}
      ctx.stroke(); ctx.restore();
      symText('γ', '', '', this.x - this.vx/Math.hypot(this.vx,this.vy)*35, this.y - 22, 26, '#d9b8ff', 'center');
    } else if (k === 'n' || k === 'p'){
      ball(this.x, this.y, Math.max(6, s), k === 'n' ? COL.n : COL.p);
      label(k, this.x, this.y - Math.max(6, s) - 12, 18, '#dfe6ef', 'center');
    } else if (k === 'flash'){
      const a = 1 - this.age/this.life; glow(this.x, this.y, 30 + this.age*600, `rgba(255,240,180,${a})`, 1);
    }
  }
}

let audio = null;
function clickSound(){
  if (!audio) return;
  try{
    const t = audio.currentTime, len = Math.floor(audio.sampleRate*0.004);
    const b = audio.createBuffer(1, len, audio.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (rnd()*2-1)*(1 - i/len);
    const s = audio.createBufferSource(); s.buffer = b; const g = audio.createGain(); g.gain.value = 0.6;

function slider(id, text, min, max, step, val, unit){return `<div class="sl"><div class="lab"><span>${text}</span><b id="${id}_v"></b></div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;}
function seg(id, items, on){return `<div class="seg" id="${id}">`+items.map(([k, t]) => `<button data-k="${k}" class="${k===on?'on':''}">${t}</button>`).join('')+`</div>`;}
function bindSeg(id, cb){const el = $('#'+id); el.querySelectorAll('button').forEach(b => b.onclick = () => {el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); cb(b.dataset.k);});}
function setEq(html){$('#eq').innerHTML = html || '';}
function setHint(t){$('#hint').textContent = t || '';}
function arrow(x1, y1, x2, y2, col){
  const a = Math.atan2(y2-y1, x2-x1), L = Math.hypot(x2-x1, y2-y1);
  ctx.save(); ctx.translate(x1, y1); ctx.rotate(a); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2.5;
  ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 3;

/* ===================== Gemeinsame Bausteine ===================== */
const FUS_SYM = {1:'H', 2:'He'};
/* kleiner Kern als Kugelhaufen; Z Protonen, N Neutronen, s = Radius eines Nukleons in px */
function cluster(Z, N, x, y, s, rot, alpha){
  const A = Z + N; if (A <= 0) return;
  if (A === 1){ball(x, y, s, Z ? COL.p : COL.n, alpha); return;}
  const P = pack(A), c = Math.cos(rot || 0), sn = Math.sin(rot || 0);
  const pts = P.map((p, i) => [p[0]*c - p[2]*sn, p[1], p[0]*sn + p[2]*c, i % A < Z ? 'p' : 'n']);
  // Protonen und Neutronen gleichmäßig verteilen
  const t = []; let zp = 0; for (let i = 0; i < A; i++){const want = Math.round((i + 1)*Z/A); t.push(want > zp ? 'p' : 'n'); if (want > zp) zp++;}
  pts.forEach((p, i) => p[3] = t[i]);
  pts.sort((a, b) => a[2] - b[2]);
  for (const p of pts) ball(x + p[0]*s*0.95, y + p[1]*s*0.95, s, p[3] === 'p' ? COL.p : COL.n, alpha);
}
function clusterR(A, s){return A <= 1 ? s : packRadius(A)*s*0.95;}
/* Textumbruch im Canvas, gibt die Anzahl der Zeilen zurück */
function wrapLabel(t, x, y, maxW, size, col, align, weight, lh){
  ctx.save(); ctx.font = `${weight||600} ${size*FS}px -apple-system,Segoe UI,Roboto,Arial`;
  const words = t.split(' '), lines = []; let line = '';
  for (const w of words){const tt = line ? line + ' ' + w : w; if (ctx.measureText(tt).width > maxW && line){lines.push(line); line = w;} else line = tt;}
  if (line) lines.push(line); ctx.restore();
  lines.forEach((l, i) => label(l, x, y + i*(lh || size*1.3)*FS, size, col, align, weight));
  return lines.length;
}
const kB = 8.617e-8; // Boltzmann-Konstante in keV pro Kelvin
function fmtMioK(T){return T >= 1e9 ? fmt(T/1e9, T % 1e9 ? 1 : 0) + ' Mrd. K' : fmtInt(T/1e6) + ' Mio. K';}
function fmtE(keV){return keV >= 1000 ? fmt(keV/1000, keV >= 10000 ? 1 : 2) + ' MeV' : keV >= 10 ? fmtInt(keV) + ' keV' : fmt(keV, keV >= 1 ? 1 : 2) + ' keV';}
function normal(){let u = 0, v = 0; while (u === 0) u = rnd(); while (v === 0) v = rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v);}
function stepParticles(list, dt){for (const p of list) p.update(dt); for (let i = list.length - 1; i >= 0; i--) if (!list[i].alive) list.splice(i, 1);}
function flash(x, y, r, a){glow(x, y, r, `rgba(255,236,170,${a})`);}

/* ===================== Reiter 1: Verschmelzen ===================== */
/* Ziel ruht bei r = 0, das Geschoss kommt von rechts (Blick aus dem Schwerpunkt vereinfacht).
   Coulomb-Berg V(r) = 1440 keV·fm · Z1·Z2 / r, Berührabstand Rc = 1,2 fm·(A1^(1/3) + A2^(1/3)).
   Durchschlüpfen (Tunneleffekt) mit der Gamow-Wahrscheinlichkeit exp(−√(EG/E)), in der Simulation stark verstärkt. */
const REAC = {
  dt:{name:'D + T', t:[1,2,'T','Tritium'], p:[1,1,'D','Deuterium'], EG:1175, S:1},
  dd:{name:'D + D', t:[1,1,'D','Deuterium'], p:[1,1,'D','Deuterium'], EG:986, S:0.0022},
  pp:{name:'p + p', t:[1,0,'p','Proton'], p:[1,0,'p','Proton'], EG:493, S:0}
};
const TSTEPS = [1e6, 2e6, 5e6, 1e7, 1.5e7, 2e7, 3e7, 5e7, 7e7, 1e8, 1.5e8, 2e8, 3e8, 5e8];
const BOOST = 700;   // Verstärkung der Durchschlüpf-Wahrscheinlichkeit in der Simulation
const RMAX = 200;    // sichtbarer Abstand in fm
const Fuse = {
  key:'verschmelzen', title:'Verschmelzen',
  init(){this.r = 'dt'; this.ti = 10; this.zoom = false; this.auto = false; this.slow = false; this.tries = 0; this.hits = 0; this.shot = null; this.parts = []; this.wait = 0;},
  T(){return TSTEPS[this.ti];},
  rc(){const R = REAC[this.r]; return 1.2*(Math.cbrt(R.t[0]+R.t[1]) + Math.cbrt(R.p[0]+R.p[1]));},
  V(r){return 1440*REAC[this.r].t[0]*REAC[this.r].p[0]/r;},
  pg(E){return Math.exp(-Math.sqrt(REAC[this.r].EG/E));},
  panel(){
    return `<h2>Verschmelzen</h2>
    <h3>Reaktion</h3>${seg('u_r', [['dt','D + T'],['dd','D + D'],['pp','p + p']], this.r)}
    ${slider('u_t', 'Temperatur', 0, TSTEPS.length - 1, 1, this.ti)}
    <div class="row"><button class="btn sm" id="u_sun">Sonnenkern</button><button class="btn sm" id="u_itr">Fusionsreaktor</button></div>
    <button class="btn main" id="u_go">Zwei Kerne schießen</button>
    ${sw('u_auto', 'Immer wieder schießen', this.auto)}
    ${sw('u_slow', 'Zeitlupe', this.slow)}
    ${sw('u_zoom', 'Energieachse gespreizt (bis 50 keV)', this.zoom)}
    <div class="info" id="u_info"></div>
    <details><summary>Warum stoßen sich die Kerne ab?</summary><div>Beide Kerne sind positiv geladen. Gleiche Ladungen stoßen sich ab, und zwar umso stärker, je näher sie sich kommen. Das zeigt der „Energieberg“ unten. Erst wenn sich die Kerne berühren, hält die Kernkraft sie zusammen. Sie ist stärker als die Abstoßung, reicht aber nicht weit.</div></details>
    <details><summary>Durchschlüpfen (Tunneleffekt)</summary><div>Selbst bei 150 Millionen Grad haben die Kerne im Mittel rund 20-mal zu wenig Bewegungsenergie, um über den Berg zu kommen (sie sind dafür etwa 5-mal zu langsam). Nach den Regeln, die wir aus dem Alltag kennen, gäbe es also keine Kernfusion, auch nicht in der Sonne.<br>Trotzdem schlüpfen ab und zu Kerne durch den Berg hindurch. Das ist ein Effekt der <b>Quantenphysik</b>, man nennt ihn Tunneleffekt. Er funktioniert nicht wie ein echter Tunnel: Es gibt kein Loch im Berg, der Kern ist einfach mit einer kleinen Wahrscheinlichkeit plötzlich auf der anderen Seite. Je schneller der Kern ist, desto eher klappt es.</div></details>
    <details><summary>Was ist hier vereinfacht?</summary><div>• Die Kerne sind etwa 10-mal zu groß gezeichnet, die Abstände stimmen (Maßstabsbalken).<br>• In der Simulation schlüpfen viel mehr Kerne durch als in Wirklichkeit, sonst müsstest du tausende Male schießen. Die echte Chance steht im Kasten oben.<br>• Der schwere Kern bleibt der Einfachheit halber stehen.<br>• 1 fm (Femtometer) = 0,000 000 000 000 001 m. 1 keV und 1 MeV sind Energieeinheiten für Teilchen: 1 MeV = 1000 keV.</div></details>`;
  },
  bind(){
    bindSeg('u_r', k => {this.r = k; this.shot = null; this.parts = []; this.tries = this.hits = 0; this.info();});
    const s = $('#u_t'), upd = () => {this.ti = +s.value; $('#u_t_v').textContent = fmtMioK(this.T()); this.info();};
    s.oninput = upd; upd();
    $('#u_sun').onclick = () => {this.ti = 4; s.value = 4; upd();};
    $('#u_itr').onclick = () => {this.ti = 10; s.value = 10; upd();};
    $('#u_go').onclick = () => this.fire();
    $('#u_auto').onchange = e => {this.auto = e.target.checked; if (this.auto && !this.shot) this.fire();};
    $('#u_slow').onchange = e => {this.slow = e.target.checked;};
    $('#u_zoom').onchange = e => {this.zoom = e.target.checked;};
  },
  enter(){setHint(''); this.eqIdle(); this.info();},
  eqIdle(){const R = REAC[this.r]; setEq(`${R.name}<span class="small">Tippe auf „Zwei Kerne schießen“</span>`);},
  info(){
    const el = $('#u_info'); if (!el) return;
    const R = REAC[this.r], Em = 1.5*kB*this.T(), Vc = this.V(this.rc());
    let real;
    if (R.S === 0) real = 'Zwei Protonen verschmelzen fast nie, auch wenn sie durchschlüpfen (siehe Reiter „Sonne“).';
    else {const p = R.S*this.pg(Em); real = p < 1e-12 ? 'In Wirklichkeit verschmelzen bei dieser Temperatur praktisch nie zwei Kerne.' : `In Wirklichkeit verschmilzt grob nur <b>einer von ${fmtInt(Math.max(1, 1/p))}</b> Zusammenstößen.`;}
    el.innerHTML = `Mittlere Bewegungsenergie: <b>${fmtE(Em)}</b><br>Höhe des Energiebergs: <b>${fmtE(Vc)}</b><br>Die Kerne haben etwa <b>${fmtInt(Vc/Em)}-mal</b> zu wenig Bewegungsenergie. ${real}`;
  },
  fire(){
    if (this.shot && this.shot.ph !== 'done') return;
    const R = REAC[this.r], kT = kB*this.T();
    let E = 0; for (let i = 0; i < 3; i++){const g = normal(); E += g*g;} E = Math.max(0.05*kT, E*kT/2);
    const rt = this.V(1)/E, rc = this.rc();
    const slip = rt > rc && rnd() < 1 - Math.exp(-BOOST*Math.max(R.S, R.S === 0 ? 1 : 0)*this.pg(E));
    const v0 = clamp(60 + 80*Math.sqrt(E/20), 50, 200);
    this.shot = {E, rt, rc, slip, v0, r:RMAX, dir:-1, ph:rt >= RMAX*0.97 ? 'far' : 'in', t:0};
    this.tries++;
    setEq(`${R.name}<span class="small">Bewegungsenergie dieses Kerns: ${fmtE(E)}</span>`);
  },
  geo(){
    const port = PORT();
    const x0 = port ? 40 : 70, x1 = W - (port ? 20 : 40), lane = port ? H*0.25 : H*0.30;
    const gy = port ? H*0.46 : H*0.52, gh = H - gy - (port ? 70 : 64);
    const px = (x1 - x0)/RMAX, s = clamp(px*3.4, 9, 17);
    return {x0, x1, lane, gy, gh, px, s, emax:this.zoom ? 50 : 500};
  },
  update(dt){
    if (this.slow) dt *= 0.3;
    stepParticles(this.parts, dt);
    const sh = this.shot; if (!sh){if (this.auto){this.wait += dt; if (this.wait > 0.4){this.wait = 0; this.fire();}} return;}
    sh.t += dt;
    if (sh.ph === 'in' || sh.ph === 'out'){
      const ek = Math.max(0, 1 - this.V(sh.r)/sh.E), v = Math.max(0.12, Math.sqrt(ek))*sh.v0;
      sh.r += sh.dir*v*dt;
      if (sh.ph === 'in' && sh.r <= Math.max(sh.rt, sh.rc)){
        sh.r = Math.max(sh.rt, sh.rc);
        if (sh.slip){sh.ph = 'slip'; sh.t = 0; sh.r0 = sh.r;} else {sh.ph = 'out'; sh.dir = 1;}
      }
      if (sh.ph === 'out' && sh.r >= RMAX){sh.ph = 'done';}
    } else if (sh.ph === 'far'){
      if (sh.t > 1.6) sh.ph = 'done';
    } else if (sh.ph === 'slip'){
      sh.r = lerp(sh.r0, sh.rc*0.55, Math.min(1, sh.t/0.9));
      if (sh.t > 0.9){
        if (REAC[this.r].S === 0){sh.ph = 'out'; sh.dir = 1; sh.r = sh.rc; sh.bounce = true;
          setEq(`p + p<span class="small">Durchgeschlüpft, aber die beiden Protonen fliegen wieder auseinander.</span>`);}
        else this.fuse();
      }
    } else if (sh.ph === 'fused'){
      if (sh.t > 2.6) sh.ph = 'done';
    }
    if (sh.ph === 'done'){
      this.shot = null; this.wait = 0;
      if (!this.auto) this.eqIdle();
    }
  },
  fuse(){
    const sh = this.shot, g = this.geo(); sh.ph = 'fused'; sh.t = 0; this.hits++;
    const x = g.x0 + sh.r*g.px, y = g.lane;

      for (let j = 0; j <= 96; j++){const phi = j/96*TAU, s = Math.sin(phi); const p = this.pt(g, phi, th, rh); if (back ? s > 0.05 : s <= 0.05){first = true; continue;} first ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]); first = false;}
      ctx.stroke();
    }
    ctx.restore();
  },
  coils(g, back){
    const N = this.type === 'tok' ? 16 : 20, ct = Math.sqrt(1 - g.ty*g.ty);
    for (let i = 0; i < N; i++){
      const phi = i/N*TAU + 0.1, s = Math.sin(phi); if (back ? s > 0 : s <= 0) continue;
      const er = [Math.cos(phi), Math.sin(phi)*g.ty], et = [-Math.sin(phi), Math.cos(phi)*g.ty];
      const c = this.pt(g, phi, 0, 0);
      ctx.beginPath();
      for (let j = 0; j <= 40; j++){
        const th = j/40*TAU; let tw = 0; if (this.type === 'ste') tw = 0.35*Math.sin(th + 5*phi);
        const rx = Math.cos(th)*g.a*1.35, rz = Math.sin(th)*g.a*(this.type === 'tok' ? 1.7 : 1.45);
        const x = c[0] + er[0]*rx + et[0]*tw*g.a, y = c[1] + er[1]*rx + et[1]*tw*g.a - rz*ct;
        j ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      const lw = clamp(g.a*0.16, 3, 9);
      if (!FLAT){ctx.strokeStyle = back ? 'rgba(120,70,30,.55)' : 'rgba(90,50,20,.95)'; ctx.lineWidth = lw + 2; ctx.stroke();}
      ctx.strokeStyle = FLAT ? (back ? 'rgba(220,140,70,.4)' : '#d98a46') : (back ? 'rgba(214,140,70,.5)' : '#e09a52'); ctx.lineWidth = FLAT ? 2.5 : lw; ctx.stroke();
      if (!FLAT && !back){ctx.strokeStyle = 'rgba(255,220,170,.55)'; ctx.lineWidth = lw*0.3; ctx.stroke();}
    }
  },
  thermo(g){
    const port = g.port, x = port ? W - 90 : W - 96, y0 = port ? 40 : 60, h = port ? H*0.5 : H - 140, Tmax = 3e8;
    const Y = T => y0 + h - T/Tmax*h, Tk = Math.min(Tmax, this.T*11.6e6);
    ctx.fillStyle = 'rgba(255,255,255,.08)'; rrect(x - 12, y0 - 4, 24, h + 8, 10); ctx.fill();
    const gr = ctx.createLinearGradient(0, y0 + h, 0, y0); gr.addColorStop(0, '#ff5a3d'); gr.addColorStop(.5, '#ff9ad0'); gr.addColorStop(1, '#c8d8ff');
    ctx.fillStyle = FLAT ? '#ff7a6b' : gr; rrect(x - 7, Y(Tk), 14, y0 + h - Y(Tk), 6); ctx.fill();
    label('Temperatur', x, y0 - 18, 12, '#dbe5f7', 'center', 700);
    for (const [T, t] of [[0, '0'], [1.5e7, 'Sonnenkern'], [1.5e8, '150 Mio. K'], [3e8, '300 Mio. K']]){ctx.strokeStyle = '#8fa3c7'; ctx.beginPath(); ctx.moveTo(x + 12, Y(T)); ctx.lineTo(x + 16, Y(T)); ctx.stroke(); label(t, x + 18, Y(T), 11, '#aab8d4', 'left');}
  }
};
/* ===================== Reiter 5: Spaltung und Fusion ===================== */
const CMP = [
  ['Brennstoff', 'Uran-235, aus Uranerz gewonnen', 'Deuterium aus Meerwasser, Tritium wird im Reaktor aus Lithium erzeugt', 'fuel'],
  ['Energie pro Reaktion', 'etwa 200 MeV', '17,6 MeV', 'e1'],
  ['Energie pro kg Brennstoff', 'wie 2800 t Steinkohle', 'wie 11 500 t Steinkohle', 'ekg'],
  ['Abfall', 'radioaktive Spaltprodukte und andere Stoffe, teils viele tausend Jahre gefährlich', 'Helium ist harmlos. Tritium und die Reaktorwand sind radioaktiv, klingen aber in etwa 100 Jahren weitgehend ab', 'waste'],
  ['Kettenreaktion', 'ja, muss ständig geregelt werden', 'nein, bei einer Störung erlischt das Plasma', 'chain'],
  ['Stand heute', 'Kraftwerke liefern seit den 1950er-Jahren Strom', 'Forschungsanlagen, noch kein Strom im Netz', 'now'],
  ['Als Waffe', 'Atombombe', 'Wasserstoffbombe (mit einer Atombombe als Zünder)', 'bomb']
];
const Compare = {
  key:'vergleich', title:'Spaltung und Fusion',
  init(){this.t = 0; this.sel = 1;},
  panel(){
    return `<h2>Spaltung und Fusion</h2>
    <button class="btn main" id="c_go">Beide noch einmal starten</button>
    <div class="info">Tippe auf eine Zeile der Tabelle, um sie hervorzuheben.</div>
    <div class="info" id="c_det"></div>
    <details><summary>Die Wasserstoffbombe</summary><div>In einer Wasserstoffbombe zündet zuerst eine Atombombe, die mit Kernspaltung arbeitet. Sie erzeugt für einen winzigen Moment Temperaturen und Drücke wie im Inneren eines Sterns. Dadurch verschmelzen Deuterium und Tritium, und es wird noch viel mehr Energie frei.<br>Wasserstoffbomben können hundert- bis tausendmal stärker sein als die Atombomben, die 1945 auf Hiroshima und Nagasaki abgeworfen wurden. Sie wurden ab 1952 getestet, im Krieg aber nie eingesetzt.<br>In einem Fusionsreaktor ist so eine Explosion nicht möglich: Dort ist nur sehr wenig Brennstoff gleichzeitig im Plasma, weniger als ein Gramm.</div></details>
    <details><summary>Warum gibt es noch keine Fusionskraftwerke?</summary><div>Das Plasma muss über 100 Millionen Grad heiß sein und lange genug zusammengehalten werden. Das gelingt bisher nur für Sekunden bis Minuten, und meist steckt man mehr Energie hinein, als herauskommt. Außerdem müssen Wände entwickelt werden, die den Neutronenbeschuss lange aushalten.</div></details>`;
  },
  bind(){$('#c_go').onclick = () => {this.t = 0;}; this.detail();},
  enter(){
    setHint(''); setEq('');
    let box = $('#cmp'); if (!box){box = document.createElement('div'); box.id = 'cmp'; $('#stage').appendChild(box);}
    box.innerHTML = `<table><tr><th></th><th class="cs">Kernspaltung</th><th class="cf">Kernfusion</th></tr>` +
      CMP.map((r, i) => `<tr data-i="${i}"><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('') + `</table>`;
    box.querySelectorAll('tr[data-i]').forEach(tr => tr.onclick = () => {this.sel = +tr.dataset.i; this.mark(); this.detail();});
    this.mark();
  },
  leave(){const b = $('#cmp'); if (b) b.remove();},
  mark(){document.querySelectorAll('#cmp tr[data-i]').forEach(tr => tr.classList.toggle('on', +tr.dataset.i === this.sel));},
  detail(){
    const el = $('#c_det'); if (!el) return;
    const D = {
      fuel:'Uran muss aus Erz gewonnen und angereichert werden. Deuterium gibt es fast unbegrenzt: In jedem Liter Meerwasser stecken etwa 33 mg. Tritium kommt in der Natur kaum vor und muss im Reaktor aus Lithium erzeugt werden.',
      e1:'Eine einzelne Spaltung liefert mehr Energie als eine einzelne Fusion. Der Urankern hat aber 235 Nukleonen, D und T zusammen nur 5.',
      ekg:'Pro Kilogramm Brennstoff liefert die Fusion etwa viermal so viel Energie wie die Spaltung und mehrere Millionen Mal so viel wie das Verbrennen von Kohle.',
      waste:'Bei der Spaltung entstehen radioaktive Spaltprodukte wie Caesium-137 und Strontium-90 sowie langlebige schwere Kerne. Bei der Fusion entsteht Helium. Radioaktiv sind dort das Tritium (Halbwertszeit 12,3 Jahre) und die Bauteile, die von Neutronen getroffen werden.',
      chain:'Bei der Spaltung setzt jede Spaltung neue Neutronen frei, die weitere Spaltungen auslösen. Das muss geregelt werden. Bei der Fusion gibt es so etwas nicht: Fällt die Heizung oder das Magnetfeld aus, kühlt das Plasma ab und die Fusion stoppt.',
      now:'Kernkraftwerke gibt es seit den 1950er-Jahren. In Deutschland wurden die letzten 2023 abgeschaltet. Fusionsanlagen wie ITER und Wendelstein 7-X sind Forschungsanlagen.',
      bomb:'Beide Arten von Kernreaktion wurden auch für Waffen genutzt. Mehr dazu unten bei „Die Wasserstoffbombe“.'
    };
    el.innerHTML = `<b>${CMP[this.sel][0]}:</b> ${D[CMP[this.sel][3]]}`;
  },
  update(dt){this.t += dt; if (this.t > 6) this.t = 0;},
  draw(){
    const port = PORT(), top = port ? 10 : 14, hh = port ? H*0.36 : H*0.36;
    const halves = [[W*0.25, 'Kernspaltung', '#ffb27a'], [W*0.75, 'Kernfusion', '#8fe0b0']];
    const cy = top + hh*0.55, s = clamp(hh/34, 3, 7), t = this.t, hl = CMP[this.sel][3];
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.moveTo(W/2, top); ctx.lineTo(W/2, top + hh); ctx.stroke();
    halves.forEach(h => label(h[1], h[0], top + 14, 17, h[2], 'center', 800));
    // Spaltung
    {const cx = halves[0][0], k = Math.min(1, t/1.2);
      if (t < 1.2){cluster(92, 143, cx, cy, s, t*0.5); ball(cx - W*0.2 + k*(W*0.2 - clusterR(235, s)), cy, Math.max(4, s), COL.n);
        if (hl === 'fuel') label('Uran-235', cx, cy + clusterR(235, s) + 14, 14, '#ffd666', 'center', 800);}
      else {const d = Math.min(1, (t - 1.2)/1.2)*W*0.11;
        cluster(56, 85, cx - d, cy - d*0.2, s, t*0.4); cluster(36, 56, cx + d, cy + d*0.25, s, -t*0.4);
        for (let i = 0; i < 3; i++){const a = -1 + i*1.1; ball(cx + Math.cos(a)*d*1.9, cy + Math.sin(a)*d*1.6, Math.max(4, s), COL.n);}
        flash(cx, cy, 20 + d*2, Math.max(0, 1 - (t - 1.2)/1.2)*0.8);
        const big = hl === 'e1' || hl === 'ekg';
        label(hl === 'ekg' ? '8 · 10¹³ J pro kg' : '≈ 200 MeV', cx, top + hh - 10, big ? 20 : 15, big ? '#ffd666' : '#ffe6b0', 'center', 800);
        if (hl === 'waste') label('radioaktive Spaltprodukte', cx, cy + clusterR(141, s) + 10, 14, '#ff9a8e', 'center', 800);
        if (hl === 'chain') label('neue Neutronen → nächste Spaltung', cx, cy - clusterR(141, s) - 22, 13, '#ff9a8e', 'center', 700);}
    }
    // Fusion
    {const cx = halves[1][0], s2 = s*2.2;
      if (t < 1.2){const d = (1 - t/1.2)*W*0.14 + clusterR(3, s2); cluster(1, 1, cx - d, cy, s2, t); cluster(1, 2, cx + d, cy, s2, -t);
        if (hl === 'fuel'){label('Deuterium', cx - d, cy + clusterR(3, s2) + 14, 14, '#ffd666', 'center', 800); label('Tritium', cx + d, cy + clusterR(3, s2) + 14, 14, '#ffd666', 'center', 800);}}
      else {const d = Math.min(1, (t - 1.2)/1.2);
        cluster(2, 2, cx - d*W*0.04, cy + d*8, s2, t); ball(cx + d*W*0.18, cy - d*hh*0.2, Math.max(4, s2*0.9), COL.n);
        flash(cx, cy, 20 + d*90, (1 - d)*0.8);
        const big = hl === 'e1' || hl === 'ekg';
        label(hl === 'ekg' ? '3 · 10¹⁴ J pro kg' : '17,6 MeV', cx, top + hh - 10, big ? 20 : 15, big ? '#ffd666' : '#ffe6b0', 'center', 800);
        if (hl === 'waste') label('Helium: harmlos', cx - d*W*0.04, cy + clusterR(4, s2) + 18, 14, '#8fe0b0', 'center', 800);
        if (hl === 'chain') label('keine Kettenreaktion', cx, cy - clusterR(4, s2) - 22, 13, '#8fe0b0', 'center', 700);}
    }
    // Platz für die Tabelle
    const box = $('#cmp'); if (box){box.style.top = (top + hh + 6) + 'px';}
  }
};
/* ===================== Steuerung ===================== */
const SCENES = [Fuse, Energy, Sun, Reactor, Compare];
let cur = null, applyFS = null;
function resize(){
  const r = $('#stage').getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(r.width*DPR); cv.height = Math.round(r.height*DPR);
  cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
  W = r.width; H = r.height; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  spriteCache.clear();
}
function show(sc){
  if (cur && cur.leave) cur.leave();
  cur = sc;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.k === sc.key));
  const tb = document.querySelector('#tabs button.on'); if (tb && tb.scrollIntoView) try{tb.scrollIntoView({block:'nearest', inline:'center'});}catch(e){}
  $('#panel').innerHTML = sc.panel(); $('#panel').scrollTop = 0;
  sc.bind(); if (sc.enter) sc.enter();
  try{localStorage.setItem('fusionslabor_tab', sc.key);}catch(e){} try{if (location.hash !== '#' + sc.key) history.replaceState(null, '', '#' + sc.key);}catch(e){} // Direktlink: Adresse zeigt den Reiter
}
function start(){
  const tabs = $('#tabs');
  SCENES.forEach((s, i) => {s.init(); const b = document.createElement('button'); b.textContent = s.title; b.dataset.k = s.key; b.onclick = () => show(s); tabs.appendChild(b);});
  resize(); window.addEventListener('resize', () => {resize(); if (typeof applyFS === 'function') applyFS(); if (cur){if (cur.layer !== undefined) cur.layer = null; cur.dots = null; cur.ldots = null;}});
  cv.addEventListener('pointerdown', e => {const r = cv.getBoundingClientRect(); if (cur && cur.tap) cur.tap(e.clientX - r.left, e.clientY - r.top);});
  const pref = (k, d) => {try{const v = localStorage.getItem('fusionslabor_' + k); return v === null ? d : v === '1';}catch(e){return d;}};
  const save = (k, v) => {try{localStorage.setItem('fusionslabor_' + k, v ? '1' : '0');}catch(e){}};
  // Schriftstufen 0–4 (A− / A+); Stufe 2 = bisheriges „groß“, auf dem Handy kleiner skaliert
  const FSL = [0.85, 1, 1.25, 1.4, 1.55], PZL = [1, 1, 1, 1.1, 1.2];
  let lvl = NaN; try{lvl = parseInt(localStorage.getItem('fusionslabor_fs'), 10);}catch(e){}
  if (!(lvl >= 0 && lvl < FSL.length)) lvl = PHONE() ? 1 : (pref('big', true) ? 2 : 1);
  let panel = pref('panel', true);
  const fsOf = () => FSL[lvl]*(PHONE() ? 0.72 : 1);
  applyFS = () => {FS = fsOf(); const st = document.documentElement.style; st.setProperty('--fs', FS); st.setProperty('--pz', PHONE() ? 1 : PZL[lvl]);
    $('#t_fsm').disabled = lvl <= 0; $('#t_fsp').disabled = lvl >= FSL.length - 1;};
  const apply = () => {applyFS();
    document.querySelector('main').classList.toggle('nopanel', !panel); $('#t_panel').classList.toggle('on', panel);
    resize(); if (cur){cur.dots = null; cur.ldots = null;}};
  const step = d => {lvl = clamp(lvl + d, 0, FSL.length - 1); try{localStorage.setItem('fusionslabor_fs', lvl);}catch(e){} apply();};
  $('#t_fsm').onclick = () => step(-1); $('#t_fsp').onclick = () => step(1);
  FLAT = pref('flat', false); const vbtn = () => {$('#t_view').textContent = FLAT ? '2D' : '3D';}; vbtn();
  $('#t_view').onclick = () => {FLAT = !FLAT; save('flat', FLAT); vbtn(); spriteCache.clear();};
  $('#t_panel').onclick = () => {panel = !panel; save('panel', panel); apply();};
  $('#t_full').onclick = () => {const d = document, el = d.documentElement;
    const on = d.fullscreenElement || d.webkitFullscreenElement;
    try{if (on){(d.exitFullscreen || d.webkitExitFullscreen).call(d);} else {(el.requestFullscreen || el.webkitRequestFullscreen).call(el);}}catch(e){}
    setTimeout(resize, 400);};
  ['fullscreenchange','webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => setTimeout(() => {resize(); if (cur){cur.dots = null; cur.ldots = null;}}, 100)));
  apply();
  let k = null; try{k = localStorage.getItem('fusionslabor_tab');}catch(e){}
  const fromHash = () => {let h = ''; try{h = decodeURIComponent(location.hash.slice(1)).toLowerCase();}catch(e){} return SCENES.find(s => s.key === h);}; window.addEventListener('hashchange', () => {const s = fromHash(); if (s && s !== cur) show(s);}); show(fromHash() || SCENES.find(s => s.key === k) || SCENES[0]); // Direktlink: Datei.html#reiter öffnet diesen Reiter
  let last = performance.now();
  const loop = now => {
    const dt = Math.min(0.05, (now - last)/1000); last = now;
    if (cur){cur.update(dt); ctx.clearRect(0, 0, W, H); cur.draw();}
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
start();
</script>

<script>
/* Scrollbereiche, die bis unter den Hinweis reichen, bekommen unten 20 px Luft,
   damit ihr letzter Inhalt nicht dauerhaft vom Hinweis verdeckt wird. */
(function(){
  var hin=document.getElementById('ki-hinweis');
  function platz(){
    var alt=document.querySelectorAll('.ki-platz');
    for(var i=0;i<alt.length;i++)alt[i].classList.remove('ki-platz');
    var vw=innerWidth,vh=innerHeight,hb=hin.getBoundingClientRect();
    var els=document.body.querySelectorAll('*');
    function passt(el){
      var cs=getComputedStyle(el);
      if(cs.display==='block'||cs.display==='flow-root')return true;
      return cs.display==='flex'&&/column/.test(cs.flexDirection);
    }
    for(var j=0;j<els.length;j++){
      var el=els[j];if(el===hin||el.closest('svg'))continue;
      var oy=getComputedStyle(el).overflowY;
      if(oy!=='auto'&&oy!=='scroll')continue;
      var r=el.getBoundingClientRect();
      if(r.height<40||r.bottom<vh-hb.height-4||r.right<hb.left+20||r.left>vw)continue;
      if(passt(el))el.classList.add('ki-platz');
    }
    var se=document.scrollingElement||document.documentElement;
    if(se.scrollHeight>vh+2&&passt(document.body))document.body.classList.add('ki-platz');
  }
  var t;function spaeter(){clearTimeout(t);t=setTimeout(platz,150);}
  addEventListener('resize',spaeter);addEventListener('load',spaeter);
  document.addEventListener('click',spaeter,true);
  platz();
})();
</script>
